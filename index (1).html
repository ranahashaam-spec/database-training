<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="BPO Wizard Database Training Document: a recruiting database and ATS/CRM playbook in 10 chapters.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%2316a870%27/%3E%3C/svg%3E">
<title>Database Training Document</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout concept: a sticky branded header over a single reading column. Contents page is a card grid; each chapter is a stack of point boxes that open to definitions, examples (stair tabs) and flip cards. Every page ends in an animated green wave. The brand motif is the green dot from the BPO Wizard logo. */
:root{
  --bg:#ffffff;
  --ink:#13201a;
  --ink2:#3b4a43;
  --muted:#64736c;
  --line:#e0eae4;
  --tint:#f0faf5;
  --tint2:#dcf3e7;
  --mint:#bfe3d0;
  --green:#16a870;
  --green-deep:#0a7b50;
  --green-dark:#07553a;
  --warn:#9a4a14;
  --warn-tint:#fdf1e7;
  --f-display:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:6px}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.narrow{max-width:880px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:14px;height:64px}
.logo{border:0;background:none;padding:0;display:flex;align-items:center;flex:none}
.logo img{height:28px;width:auto;display:block}
.hdr-t{margin-left:auto;font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.hbtn{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:600 13px var(--f-body);transition:background .2s,color .2s,border-color .2s}
.hbtn:hover{background:var(--green-deep);color:#fff;border-color:var(--green-deep)}
.prog{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:linear-gradient(90deg,var(--green),var(--green-deep))}
@media (max-width:640px){.hdr-t{display:none}.hbtn{margin-left:auto}}

.page{animation:pageIn .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* cover */
.cover{position:relative;padding-block:56px 36px;background:radial-gradient(circle at 88% 8%,var(--tint2),transparent 42%)}
.eyebrow{display:flex;align-items:center;gap:10px;font:500 12px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--green-deep)}
.dot{width:11px;height:11px;border-radius:50%;background:var(--green);display:inline-block;flex:none;box-shadow:0 0 0 0 rgba(22,168,112,.5);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(22,168,112,0)}100%{box-shadow:0 0 0 0 rgba(22,168,112,0)}}
.cover h1{margin:20px 0 10px;font:700 clamp(38px,7vw,80px)/1.02 var(--f-display);letter-spacing:-.035em;text-wrap:balance;max-width:14ch}
.cover h1 em{font-style:normal;color:var(--green-deep)}
.cover h2{margin:0 0 14px;font:600 clamp(18px,2.4vw,24px)/1.3 var(--f-display);letter-spacing:-.01em;color:var(--ink2);text-wrap:balance}
.cover .sub{max-width:58ch;color:var(--ink2);margin:0 0 28px;font-size:17px}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:0 0 24px}
.pillar{border-top:2px solid var(--green);padding-top:10px}
.pillar small{display:block;font:500 11px var(--f-mono);letter-spacing:.14em;color:var(--muted)}
.pillar b{font:600 18px var(--f-display)}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin:44px 0 18px}
.sec-h h3{margin:0;font:700 clamp(24px,3.4vw,34px)/1.15 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.sec-h p{margin:0;color:var(--muted);max-width:60ch}

.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.tcard{position:relative;display:flex;flex-direction:column;gap:10px;min-height:210px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:22px;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s}
.tcard::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--tint),var(--tint2));transform:translateY(101%);transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.tcard>*{position:relative}
.tcard:hover{transform:translateY(-4px);border-color:var(--green);box-shadow:0 16px 32px -16px rgba(10,123,80,.4)}
.tcard:hover::before{transform:none}
.tnum{font:600 13px var(--f-mono);color:var(--green-deep);display:flex;align-items:center;gap:8px}
.tnum i{display:block;height:2px;width:22px;background:var(--green);transition:width .3s}
.tcard:hover .tnum i{width:44px}
.tt{font:600 19px/1.25 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.ts{color:var(--ink2);font-size:15px}
.tgo{margin-top:auto;display:flex;align-items:center;gap:8px;font:600 13px var(--f-mono);color:var(--green-deep)}
.tgo span{transition:transform .25s}
.tcard:hover .tgo span{transform:translateX(6px)}
.intro-end{margin:40px 0 0;padding:22px 24px;border-radius:18px;background:var(--tint);display:flex;flex-wrap:wrap;gap:6px 24px;align-items:center}
.intro-end b{font:600 13px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--green-deep)}

/* chapter */
.ch-h{padding-block:44px 8px}
.ch-h h2{margin:14px 0 8px;font:700 clamp(30px,5vw,52px)/1.08 var(--f-display);letter-spacing:-.03em;text-wrap:balance}
.ch-h .lede{margin:0;font-size:18px;color:var(--ink2);max-width:60ch}
.ch-h .intro{margin:14px 0 0;color:var(--ink2);max-width:68ch}
.ch-tools{display:flex;gap:10px;margin:22px 0 18px;align-items:center;flex-wrap:wrap}
.ch-tools span{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.pts{display:grid;gap:12px}

.pt{border:1px solid var(--line);border-radius:16px;background:#fff;transition:border-color .25s,box-shadow .25s}
.pt:hover{border-color:var(--mint)}
.pt.open{border-color:var(--green);box-shadow:0 14px 32px -20px rgba(10,123,80,.45)}
.pt-h{width:100%;display:flex;align-items:center;gap:14px;padding:18px 20px;background:none;border:0;text-align:left}
.pt-mark{flex:none;width:13px;height:13px;border-radius:50%;border:2px solid var(--green);transition:background .25s,transform .25s}
.pt.open .pt-mark{background:var(--green);transform:scale(1.15)}
.pt-t{flex:1;min-width:0;font:600 clamp(17px,2.2vw,20px)/1.3 var(--f-display);letter-spacing:-.01em}
.pt-k{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
@media (max-width:560px){.pt-k{display:none}}
.chev{flex:none;color:var(--green-deep);transition:transform .3s}
.pt.open>.pt-h .chev,.ex.open>.ex-h .chev{transform:rotate(180deg)}
.pt-body{padding:2px 20px 22px;display:flex;flex-direction:column;gap:18px}
@media (max-width:560px){.pt-h{padding:16px 14px}.pt-body{padding:2px 14px 18px}}

.clp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.2,.7,.2,1)}
.clp.open{grid-template-rows:1fr}
.clp-in{min-height:0;overflow:hidden}
.clp:not(.open)>.clp-in{visibility:hidden;transition:visibility 0s .38s}

.pp{margin:0;max-width:68ch;color:var(--ink2)}
.lbl{font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--green-deep);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;background:var(--tint);border:1px solid var(--tint2);color:var(--green-dark);font-size:14px;font-weight:500;transition:background .2s,color .2s,transform .2s,border-color .2s}
.chip:hover{background:var(--green-deep);color:#fff;border-color:var(--green-deep);transform:translateY(-2px)}
.stack{display:flex;flex-direction:column;gap:10px}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.col{border-radius:14px;padding:16px 18px;background:var(--tint)}
.col.warn{background:var(--warn-tint)}
.col h4{margin:0 0 10px;font:600 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--green-deep)}
.col.warn h4{color:var(--warn)}
.col ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.col li{display:flex;gap:10px;align-items:flex-start}
.col li::before{content:"";flex:none;width:8px;height:8px;margin-top:9px;border-radius:50%;background:var(--green)}
.col.warn li::before{background:#d9803f}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:#fff;transition:transform .25s,border-color .25s,box-shadow .25s,background .25s}
.card:hover{transform:translateY(-3px);border-color:var(--green);background:var(--tint);box-shadow:0 12px 24px -16px rgba(10,123,80,.45)}
.card.warn{background:var(--warn-tint);border-color:#f0cfb3}
.card h4{margin:0 0 4px;font:600 16px var(--f-display);letter-spacing:-.005em}
.card p{margin:0;color:var(--ink2);font-size:15px}
.card .cw{font:700 13px var(--f-mono);color:var(--green-deep);display:block;margin-bottom:6px}

.ck{display:grid;gap:8px}
.ck-i{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;transition:background .2s,border-color .2s,transform .2s}
.ck-i:hover{border-color:var(--green);transform:translateX(3px)}
.ck-i.on{background:var(--tint);border-color:var(--mint)}
.ck-box{flex:none;width:22px;height:22px;margin-top:1px;border-radius:7px;border:2px solid var(--green);display:grid;place-items:center;color:#fff;transition:background .2s}
.ck-i.on .ck-box{background:var(--green-deep);border-color:var(--green-deep)}
.ck-box svg{opacity:0;transform:scale(.4);transition:opacity .2s,transform .2s}
.ck-i.on .ck-box svg{opacity:1;transform:none}
.ck-n{font:500 12px var(--f-mono);color:var(--muted)}

.rows{display:grid;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:6px 18px;padding:12px 16px;border-top:1px solid var(--line);transition:background .2s}
.row:first-child{border-top:0}
.row:hover{background:var(--tint)}
.row b{font:600 15px var(--f-display);color:var(--green-dark)}
.row span{color:var(--ink2)}
@media (max-width:520px){.row{grid-template-columns:1fr}}

.note{border-radius:12px;padding:12px 16px;background:var(--tint);color:var(--ink2);font-size:15px}
.note.todo{background:#fff;border:1.5px dashed var(--green);color:var(--green-dark)}
.answer{border-radius:14px;padding:16px 18px;background:var(--green-deep);color:#fff}
.answer b{display:block;font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.answer p{margin:0;font-weight:500}
.fig{margin:0}
.fig img{width:100%;border-radius:14px;display:block}
.fig figcaption{font-size:14px;color:var(--muted);margin-top:6px}

/* example box with stair tabs */
.ex{border-radius:14px;background:var(--tint);border:1px solid var(--tint2)}
.ex-h{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;background:none;border:0;text-align:left}
.ex-tag{flex:none;font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;background:var(--green-deep);color:#fff;padding:5px 10px;border-radius:6px}
.ex-t{flex:1;min-width:0;font-weight:600}
.ex-h:hover .ex-tag{background:var(--green)}
.ex-body{padding:4px 16px 18px;display:flex;flex-direction:column;gap:16px}
@media (max-width:560px){.ex-h{padding:12px}.ex-body{padding:4px 12px 14px}}
.stairs{list-style:none;margin:0;padding:0;display:grid;gap:8px;--step:20px}
@media (max-width:560px){.stairs{--step:8px}}
.stair{margin-left:calc(var(--i) * var(--step));min-width:0}
.stair-b{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:11px 14px;border:1px solid var(--tint2);border-bottom:4px solid var(--mint);border-radius:10px;background:#fff;transition:transform .2s,background .2s,color .2s,border-color .2s}
button.stair-b:hover{transform:translateX(4px)}
div.stair-b{cursor:default}
.stair.on .stair-b{background:var(--green-deep);border-color:var(--green-deep);border-bottom-color:var(--green-dark);color:#fff}
.sn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--tint2);color:var(--green-dark);font:600 12px var(--f-mono);display:grid;place-items:center}
.stair.on .sn{background:#fff;color:var(--green-deep)}
.sl{font-weight:600;min-width:0}
.stair-d{padding:10px 6px 4px 46px;color:var(--ink2)}
.stair-d p{margin:0 0 8px}
@keyframes stairIn{from{opacity:0;transform:translate(-20px,-12px)}to{opacity:1;transform:none}}
.ex.open .stair,.pt.open .proc .stair{animation:stairIn .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 70ms)}

.fun{display:grid;gap:8px}
.fun-r{display:grid;grid-template-columns:100px 1fr 40px;gap:10px;align-items:center;font-size:14px}
.fun-r b{font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:520px){.fun-r{grid-template-columns:78px 1fr 30px}}
.trk{height:22px;background:#fff;border-radius:6px;border:1px solid var(--tint2);overflow:hidden}
.bar{height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--green),var(--green-deep));transition:width 1s cubic-bezier(.2,.7,.2,1)}
.ex.open .bar,.ex.open .seg{width:var(--w)}
.split{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--tint2);background:#fff}
.seg{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.seg.a{background:var(--green-deep)}
.seg.b{background:var(--mint)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.cmp>div{background:#fff;border-radius:12px;padding:16px;border:1px solid var(--tint2)}
.cmp .big{font:700 clamp(26px,4vw,36px)/1 var(--f-display);letter-spacing:-.02em}
.cmp .bad .big{color:var(--warn)}
.cmp .good .big{color:var(--green-deep)}
.cmp small{display:block;color:var(--muted);margin:4px 0 10px;font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.cmp ul{margin:0;padding-left:18px;color:var(--ink2);font-size:15px}
.grp .parent{display:inline-block;padding:8px 16px;background:var(--green-deep);color:#fff;border-radius:10px;font-weight:600}
.grp .kids{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0 22px;padding-left:16px;border-left:2px solid var(--green)}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px;perspective:1200px}
.flip{padding:0;border:0;background:none;text-align:left;display:block;min-width:0}
.flip-in{display:grid;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.3,.7,.2,1)}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;display:flex;flex-direction:column;gap:8px;justify-content:space-between;min-height:132px;padding:16px 18px;border-radius:14px;-webkit-backface-visibility:hidden;backface-visibility:hidden;border:1px solid var(--line);transition:border-color .25s,box-shadow .25s}
.front{background:#fff}
.flip:hover .front{border-color:var(--green);box-shadow:0 12px 24px -16px rgba(10,123,80,.5)}
.back{background:var(--green-deep);color:#fff;border-color:var(--green-deep);transform:rotateY(180deg);justify-content:flex-start}
.flip-t{font:600 17px/1.25 var(--f-display)}
.flip-h{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--green-deep)}
.back .flip-h{color:#a8ecd0;margin-top:auto}
.bk{display:grid;gap:1px;font-size:14px}
.bk small{font:600 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:#a8ecd0}
.bk span{font-weight:500}

/* platform explorer */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;font:600 13px var(--f-body);transition:background .2s,color .2s,border-color .2s}
.tab:hover{border-color:var(--green)}
.tab[aria-pressed="true"]{background:var(--green-deep);color:#fff;border-color:var(--green-deep)}
.plats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.pl{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;min-width:0;padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff;transition:transform .25s,border-color .25s,box-shadow .25s}
.pl:hover{transform:translateY(-4px);border-color:var(--green);box-shadow:0 14px 26px -16px rgba(10,123,80,.5)}
.pl-i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--tint2);color:var(--green-dark);font:700 18px var(--f-display);transition:background .25s,color .25s,transform .25s}
.pl:hover .pl-i{background:var(--green-deep);color:#fff;transform:rotate(-8deg)}
.pl-n{font:600 17px var(--f-display)}
.pl-c{font:500 11px/1.4 var(--f-mono);letter-spacing:.06em;color:var(--muted)}
.pl-g{margin-top:auto;font:600 12px var(--f-body);color:var(--green-deep)}
.ov{position:fixed;inset:0;z-index:80;background:rgba(8,32,22,.45);animation:fade .25s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;top:0;right:0;bottom:0;z-index:90;width:min(480px,100%);overflow-y:auto;background:#fff;box-shadow:-20px 0 50px -20px rgba(8,32,22,.45);padding:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 24px;animation:slide .35s cubic-bezier(.2,.7,.2,1) both;display:flex;flex-direction:column;gap:18px}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;transition:background .2s,color .2s}
.x:hover{background:var(--green-deep);color:#fff}
.sheet h3{margin:0;font:700 32px/1.1 var(--f-display);letter-spacing:-.02em}
.sheet dl{margin:0;display:grid;gap:14px}
.sheet dt{font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--green-deep);margin-bottom:3px}
.sheet dd{margin:0;color:var(--ink2)}
.sheet .tagx{display:grid;gap:8px}
.sheet .tagx div{background:var(--tint);border-radius:10px;padding:10px 12px;font-size:15px}
.sheet .tagx b{color:var(--green-dark)}
.sheet-nav{display:flex;gap:10px;margin-top:auto}
.sheet-nav button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;transition:background .2s,border-color .2s}
.sheet-nav button:hover{background:var(--tint);border-color:var(--green)}

/* takeaway */
.take{position:relative;overflow:hidden;margin-top:30px;padding:28px;border-radius:20px;background:var(--green-deep);color:#fff}
.take::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.09)}
.take small{font:600 11px var(--f-mono);letter-spacing:.18em;color:#a8ecd0}
.take p{position:relative;z-index:1;margin:8px 0 0;font:600 clamp(20px,3vw,28px)/1.25 var(--f-display);letter-spacing:-.01em;max-width:34ch;text-wrap:balance}
.take.long p{font:500 clamp(16px,2vw,19px)/1.55 var(--f-body);max-width:70ch}

/* footer and wave */
.pager{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px}
.pg{flex:1 1 240px;min-width:0;display:grid;gap:2px;text-align:left;border:1px solid var(--line);border-radius:14px;padding:14px 18px;background:#fff;transition:border-color .2s,background .2s,transform .2s}
.pg.next{text-align:right}
.pg:hover{border-color:var(--green);background:var(--tint);transform:translateY(-2px)}
.pg small{font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pg b{font:600 16px var(--f-display)}
.waves{position:relative;height:clamp(90px,14vw,150px);margin-top:56px;overflow:hidden}
.wv{position:absolute;left:0;bottom:-1px;width:200%;height:100%;animation:wave var(--d) linear infinite}
.wv svg{display:block;width:100%;height:100%}
@keyframes wave{to{transform:translateX(-50%)}}
.wbase{background:var(--green-deep);color:#fff;padding-block:6px 20px}
.wbase .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.wbase span{opacity:.85}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .wv{animation:none!important}
}
</style>

var CH=[
{id:1,title:"Recruiting database — the concept",lede:"What a recruiting database is, why it matters, and why quality beats size.",
 take:"What a recruiting database is, why it matters, and why quality beats size.",
 sections:[
 {id:"1a",title:"What is a recruiting database?",kicker:"Definition",blocks:[
  {t:"p",text:"A structured collection of information about candidates and potential candidates, used for current and future hiring needs. More than résumés and contact details, it becomes a centralized source of recruiting information and candidate history."}]},
 {id:"1b",title:"What a record can hold",kicker:"10 fields",blocks:[
  {t:"chips",items:["Name and contact information","Current and previous companies and titles","Industry, skills and expertise","Location, education and certifications","Industry and candidate tags","Candidate status, pipelines and stages","Communication history","Previous jobs, applications and interviews","Recruiter ownership","Preferences, availability and candidate source"]}]},
 {id:"1c",title:"Why it matters",kicker:"Value",blocks:[
  {t:"cols",l:{title:"For recruiters",items:["Find relevant people faster","Search previous work","Understand interactions","Track follow-ups","Identify candidates for other roles","Build pipelines","Re-engage talent"]},
   r:{title:"For the business",items:["Reduce repetitive sourcing","Preserve knowledge","Improve productivity","Support client delivery","Reduce dependence on personal memory"]}}]},
 {id:"1d",title:"Previous work stays reusable",kicker:"Example",blocks:[
  {t:"p",text:"Candidates who were not hired for one role often remain relevant to the next one."},
  {t:"example",title:"100 Project Managers sourced",viz:{type:"split",parts:[{label:"10 hired",v:10,c:"a"},{label:"90 not hired",v:90,c:"b"}]},
   steps:[{label:"Sourced",text:"100 Project Managers are sourced for a role."},{label:"Hired",text:"10 of them are hired."},{label:"Not hired",text:"90 are not hired."},{label:"Still useful",text:"Those 90 may remain relevant to future roles."}],
   note:"These figures illustrate reuse. They are not measured performance claims."}]},
 {id:"1e",title:"Talent mapping and pipeline building",kicker:"Concept",blocks:[
  {t:"p",text:"Talent mapping organizes people by industry, function, company, geography, skills or seniority."},
  {t:"chips",label:"Mapping example",items:["Private Equity","Investment Banking","Venture Capital","Asset Management"]},
  {t:"p",text:"Pipeline building develops people for current or future opportunities."},
  {t:"example",title:"An illustrative pipeline",viz:{type:"funnel",items:[["Identified",50],["Relevant",30],["Contacted",20],["Interested",12],["Suitable",8]]},
   steps:[{text:"50 identified"},{text:"30 relevant"},{text:"20 contacted"},{text:"12 interested"},{text:"8 suitable"}]}]},
 {id:"1f",title:"Advantages and risks",kicker:"Balance",blocks:[
  {t:"cols",l:{title:"Advantages",items:["Reuse research","Retain conversations and preferences","Respond to clients faster","Maintain long-term relationships"]},
   r:{title:"Risks",tone:"warn",items:["Outdated information","Duplicate records","Weak searchability","Unstructured notes"]}},
  {t:"note",text:"Maintenance and quality control are ongoing responsibilities."}]},
 {id:"1g",title:"Quality over quantity",kicker:"Example",blocks:[
  {t:"p",text:"Usefulness, accuracy, relevance and searchability matter more than database count."},
  {t:"example",title:"500,000 records or 100,000?",viz:{type:"compare",
    a:{big:"500,000",small:"records",tone:"bad",items:["Duplicates","Outdated details","Poor classification","Little history"]},
    b:{big:"100,000",small:"records",tone:"good",items:["Accurate","Maintained","Searchable","Clear history"]}},
   steps:[{text:"A large database with duplicates, outdated details, poor classification and little history."},{text:"A smaller database of accurate, maintained, searchable records with clear history."},{text:"The smaller one is the more useful asset."}],
   note:"Illustrative comparison from the training material."}]}
 ]},

{id:2,title:"ATS vs. recruiting CRM",lede:"ATS: who are we hiring right now? CRM: who might we hire now or in the future?",
 take:"ATS: who are we hiring right now? CRM: who might we hire now or in the future?",
 sections:[
 {id:"2a",title:"How recruiting technology evolved",kicker:"Background",blocks:[
  {t:"chips",label:"Where recruiters started",items:["Résumés","Email","Spreadsheets","Paper files","Separate notes"]},
  {t:"p",text:"As hiring volumes grew, tracking became harder to organize. Recruiting software centralizes candidate information. Modern platforms may combine ATS and CRM; the distinction is primary purpose and workflow, not simply who is stored."}]},
 {id:"2b",title:"ATS: Applicant Tracking System",kicker:"Definition",blocks:[
  {t:"p",text:"An ATS manages the active hiring process, from the open position through to the hiring record."},
  {t:"chips",label:"What an ATS manages",items:["Open positions and requisitions","Applications","Résumés","Screening","Candidate stages","Interviews","Feedback","Decisions","Hiring records"]},
  {t:"note",text:"Search historical records before external sourcing, but review suitability and revalidate details rather than assuming an old candidate is still a fit."}]},
 {id:"2c",title:"CRM: talent relationships",kicker:"Definition",blocks:[
  {t:"p",text:"A recruiting CRM organizes the people you may want to hire, not only the people who applied."},
  {t:"chips",label:"What a recruiting CRM organizes",items:["Talent pools","Passive candidates","Outreach history","Mapping","Future pipelines","Nurturing","Re-engagement"]},
  {t:"note",text:"Valuable talent is not limited to applicants: an employed person, a past finalist or a previous contact may fit a future opportunity."}]},
 {id:"2d",title:"Worked example: VP Finance",kicker:"Example",blocks:[
  {t:"example",title:"One role, two perspectives",steps:[
    {label:"ATS perspective",text:"Review current applicants, previous applicants, similar roles and interview history."},
    {label:"CRM perspective",text:"Search passive VP Finance talent, existing pools, previous contacts and relationship history."},
    {label:"Bringing them together",text:"A nurtured candidate can enter an active job workflow when the right role appears."}]}]},
 {id:"2e",title:"Choosing a system",kicker:"Decision",blocks:[
  {t:"cards",items:[
   {title:"An ATS fits",text:"Job-led hiring with structured stages, feedback and decisions."},
   {title:"A CRM fits",text:"Proactive recruiting, passive talent, mapping and long-term pipelines."},
   {title:"Combined platforms",text:"Connect nurturing with active hiring and retain history in one place."}]}]},
 {id:"2f",title:"ATS and CRM at a glance",kicker:"Tap to flip",blocks:[
  {t:"flips",items:[
   {title:"Primary purpose",back:[["ATS","Manage active hiring"],["Recruiting CRM","Manage talent relationships"]]},
   {title:"Starting point",back:[["ATS","Job / requisition"],["Recruiting CRM","Candidate / talent"]]},
   {title:"Main question",back:[["ATS","Who are we hiring?"],["Recruiting CRM","Who might we hire?"]]},
   {title:"Passive candidates",back:[["ATS","May be included"],["Recruiting CRM","Major focus"]]},

{id:10,title:"Practical Recruiting Scenarios",sub:"Applying ATS/CRM and Recruiting Database Knowledge",
 lede:"Apply ATS/CRM knowledge to five day-to-day recruiting situations, with practical steps.",
 intro:"This section explains how recruiters use a recruiting database or ATS/CRM to handle common day-to-day situations. The objective is to follow a consistent process, maintain accurate candidate records, and make effective use of existing talent before starting new sourcing.",
 long:true,
 take:"A recruiting database is more than a place to store resumes. It helps recruiters reuse existing talent, preserve relationship history, avoid duplicate work, run structured searches, and maintain accurate records. Every action should follow the organization’s process, respect candidate preferences and privacy requirements, and leave a clear record of the decision or next step.",
 sections:[
 {id:"10a",title:"What should a recruiter check in the database when a new job comes in?",kicker:"Scenario 1",blocks:[
  {t:"answer",text:"Search for existing candidates using relevant job titles, skills, industry, and location. Review resumes, recruiter notes, previous submissions, and candidate availability before starting new sourcing."},
  {t:"lbl",text:"Practical steps"},
  {t:"stairs",steps:[{text:"Confirm the role requirements, essential skills, seniority, industry experience, and location."},{text:"Search the existing database using job titles, related titles, keywords, Boolean search, and available filters."},{text:"Review resumes, employment history, recruiter notes, previous submissions, contact details, and last-contact dates."},{text:"Check candidate interest and availability, and confirm that profile information is current."},{text:"Shortlist suitable candidates and record the search or screening outcome before sourcing externally."}]}]},
 {id:"10b",title:"What happens to a candidate who is not right for the current role?",kicker:"Scenario 2",blocks:[
  {t:"answer",text:"Update their profile with relevant notes, skills, and preferences. Keep them in the talent pipeline for future opportunities instead of discarding them."},
  {t:"lbl",text:"Practical steps"},
  {t:"stairs",steps:[{text:"Record the role-specific reason they were not selected, using factual and job-related notes."},{text:"Capture relevant skills, experience, location preferences, salary expectations if appropriately collected, and career interests."},{text:"Update the candidate’s status according to the organization’s process, such as “not suitable for this role” or “future opportunity.”"},{text:"Retain the candidate in an appropriate talent pool when permitted and useful."},{text:"Respect candidate communication preferences, consent, and data-retention rules before future outreach."}]}]},
 {id:"10c",title:"How should potential duplicates be handled?",kicker:"Scenario 3",blocks:[
  {t:"answer",text:"Verify duplicates using names, emails, phone numbers, and LinkedIn profiles. Merge confirmed duplicates according to database procedures while preserving important candidate information and communication history."},
  {t:"lbl",text:"Practical steps"},
  {t:"stairs",steps:[{text:"Compare identifiers such as email addresses, phone numbers, LinkedIn URLs, employment history, and location; a matching name alone is not sufficient."},{text:"Open both records and check whether they represent the same person or two different people with similar names."},{text:"Follow the organization’s duplicate-resolution procedure and use the platform’s merge function only when the match is confirmed and the user has the required permissions."},{text:"Preserve useful notes, source links, activity history, submissions, and communication records during the merge."},{text:"If the match is uncertain, flag the records for review rather than deleting either profile."}]}]},
 {id:"10d",title:"How would a recruiter search for 10 Project Managers in a market?",kicker:"Scenario 4",blocks:[
  {t:"answer",text:"Use job titles, Boolean searches, industry keywords, and location filters. Review candidate profiles, shortlist 10 qualified Project Managers, and initiate targeted outreach."},
  {t:"lbl",text:"Practical steps"},
  {t:"stairs",steps:[{text:"Clarify the market: target location or region, industry, seniority, project type, and essential qualifications."},{text:"Search for title variations such as “Project Manager,” “Senior Project Manager,” and relevant industry-specific titles."},{text:"Combine Boolean terms and filters. For example: (“Project Manager” OR “Program Manager”) AND (construction OR infrastructure), then apply the appropriate location and experience filters."},{text:"Review each profile for project scope, industry relevance, skills, career history, qualifications, and comparable responsibilities."},{text:"Validate the shortlist against job requirements, check for duplicates and current contact details, and select the 10 strongest matches."},{text:"Record search criteria and outreach status in the ATS/CRM so the process is repeatable and auditable."}]}]},
 {id:"10e",title:"How can a previous candidate be re-engaged months later?",kicker:"Scenario 5",blocks:[
  {t:"answer",text:"Review previous conversations and feedback, check their current professional status, and send a personalized follow-up about a relevant opportunity. Update their information in the database."},
  {t:"lbl",text:"Practical steps"},
  {t:"stairs",steps:[{text:"Review the candidate’s previous application, interview feedback, recruiter notes, interests, and last conversation."},{text:"Verify current employment, role, location, and other relevant professional details using appropriate sources."},{text:"Check whether the candidate’s preferences and communication permissions allow contact."},{text:"Send a concise, personalized message explaining why the opportunity may fit their experience or stated interests."},{text:"Record the outreach date, channel, response, and next follow-up action in the ATS/CRM."},{text:"If the candidate is not interested, update their preferences and follow-up status respectfully."}]}]}
 ]}
];

/* ---------- small components ---------- */
function Chev(){return html`<svg className="chev" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>`;}
function Tick(){return html`<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>`;}

function Collapse(p){
  return html`<div className=${"clp"+(p.open?" open":"")}><div className="clp-in">${p.children}</div></div>`;
}

function Stairs(p){
  var steps=p.steps, hasLabel=steps.some(function(s){return s.label;});
  var st=useState(hasLabel?0:-1), act=st[0], setAct=st[1];
  return html`<ol className=${"stairs"+(p.proc?" proc":"")}>${steps.map(function(s,i){
    var on=act===i;
    var tags=s.tags?html`<div className="chips">${s.tags.map(function(t){return html`<span className="chip" key=${t}>${t}</span>`;})}</div>`:null;
    if(s.label){
      return html`<li key=${i} className=${"stair"+(on?" on":"")} style=${{"--i":i}}>
        <button type="button" className="stair-b" aria-expanded=${on} onClick=${function(){setAct(on?-1:i);}}>
          <span className="sn">${i+1}</span><span className="sl">${s.label}</span>
        </button>
        <${Collapse} open=${on}><div className="stair-d"><p>${s.text}</p>${tags}</div><//>
      </li>`;
    }
    return html`<li key=${i} className="stair" style=${{"--i":i}}>
      <div className="stair-b"><span className="sn">${i+1}</span><span className="sl" style=${{fontWeight:500}}>${s.text}</span></div>
    </li>`;
  })}</ol>`;
}

function Viz(p){
  var v=p.v;
  if(v.type==="funnel"){
    var max=v.items[0][1];
    return html`<div className="fun">${v.items.map(function(it,i){
      return html`<div className="fun-r" key=${i}><span>${it[0]}</span><div className="trk"><div className="bar" style=${{"--w":(it[1]/max*100)+"%",transitionDelay:(i*90)+"ms"}}></div></div><b>${it[1]}</b></div>`;
    })}</div>`;
  }
  if(v.type==="split"){
    return html`<div><div className="split">${v.parts.map(function(pt,i){return html`<div key=${i} className=${"seg "+pt.c} style=${{"--w":pt.v+"%"}}></div>`;})}</div>
      <div className="legend">${v.parts.map(function(pt,i){return html`<span key=${i}><i style=${{background:pt.c==="a"?"var(--green-deep)":"var(--mint)"}}></i>${pt.label}</span>`;})}</div></div>`;
  }
  if(v.type==="compare"){
    var side=function(o){return html`<div className=${o.tone}><div className="big">${o.big}</div><small>${o.small}</small><ul>${o.items.map(function(x){return html`<li key=${x}>${x}</li>`;})}</ul></div>`;};
    return html`<div className="cmp">${side(v.a)}${side(v.b)}</div>`;
  }
  if(v.type==="group"){
    return html`<div className="grp"><span className="parent">${v.parent}</span><div className="kids">${v.kids.map(function(k){return html`<span className="chip" key=${k}>${k}</span>`;})}</div></div>`;
  }
  return null;
}

function Example(p){
  var st=useState(false), open=st[0], setOpen=st[1];
  return html`<div className=${"ex"+(open?" open":"")}>
    <button type="button" className="ex-h" aria-expanded=${open} onClick=${function(){setOpen(!open);}}>
      <span className="ex-tag">Example</span><span className="ex-t">${p.b.title}</span><${Chev}/>
    </button>
    <${Collapse} open=${open}>
      <div className="ex-body">
        ${p.b.viz?html`<${Viz} v=${p.b.viz}/>`:null}
        <${Stairs} steps=${p.b.steps}/>
        ${p.b.note?html`<div className="note">${p.b.note}</div>`:null}
      </div>
    <//>
  </div>`;
}

function Check(p){
  var st=useState({}), on=st[0], setOn=st[1];
  var n=p.items.filter(function(_,i){return on[i];}).length;
  return html`<div className="stack"><div className="ck">${p.items.map(function(t,i){
    return html`<button type="button" key=${i} className=${"ck-i"+(on[i]?" on":"")} aria-pressed=${!!on[i]} onClick=${function(){var c=Object.assign({},on);c[i]=!c[i];setOn(c);}}>
      <span className="ck-box"><${Tick}/></span><span>${t}</span></button>`;
  })}</div><span className="ck-n">${n} of ${p.items.length} reviewed. Tap a point to tick it off.</span></div>`;
}

function Flips(p){
  var st=useState({}), on=st[0], setOn=st[1];
  return html`<div className="flips">${p.items.map(function(it,i){
    return html`<button type="button" key=${i} className=${"flip"+(on[i]?" on":"")} aria-pressed=${!!on[i]} onClick=${function(){var c=Object.assign({},on);c[i]=!c[i];setOn(c);}}>
      <span className="flip-in">
        <span className="face front"><span className="flip-t">${it.title}</span><span className="flip-h">Tap to reveal details</span></span>
        <span className="face back">${it.back.map(function(r){return html`<span className="bk" key=${r[0]}><small>${r[0]}</small><span>${r[1]}</span></span>`;})}<span className="flip-h">Turn back</span></span>
      </span></button>`;
  })}</div>`;
}

function Explorer(){
  var a=useState("All"), g=a[0], setG=a[1];
  var b=useState(null), sel=b[0], setSel=b[1];
  var list=PLAT.filter(function(x){return g==="All"||x.group===g;});
  useEffect(function(){
    if(sel===null)return;
    var prev=document.body.style.overflow;
    document.body.style.overflow="hidden";
    function k(e){if(e.key==="Escape")setSel(null);}
    window.addEventListener("keydown",k);
    return function(){document.body.style.overflow=prev;window.removeEventListener("keydown",k);};
  },[sel]);
  var p=sel===null?null:PLAT[sel];
  function step(d){
    var idx=list.findIndex(function(x){return x===PLAT[sel];});
    if(idx<0){setSel(PLAT.indexOf(list[0]));return;}
    setSel(PLAT.indexOf(list[(idx+d+list.length)%list.length]));
  }
  var groupNames=["All","Enterprise suite","Corporate and growth","Agency"];
  return html`<div className="stack">
    <div className="tabs" role="group" aria-label="Filter platforms">${groupNames.map(function(n){return html`<button type="button" key=${n} className="tab" aria-pressed=${g===n} onClick=${function(){setG(n);}}>${n}</button>`;})}</div>
    ${g!=="All"?html`<div className="note">${GROUPS[g]}</div>`:null}
    <div className="plats">${list.map(function(x){
      return html`<button type="button" key=${x.name} className="pl" onClick=${function(){setSel(PLAT.indexOf(x));}}>
        <span className="pl-i">${x.name.charAt(0)}</span><span className="pl-n">${x.name}</span><span className="pl-c">${x.cat}</span><span className="pl-g">${x.group}</span></button>`;
    })}</div>
    ${p?html`<div><div className="ov" onClick=${function(){setSel(null);}}></div>
      <aside className="sheet" role="dialog" aria-modal="true" aria-label=${p.name+" details"}>
        <div className="sheet-top"><span className="lbl">${p.group}</span>
          <button type="button" className="x" aria-label="Close details" onClick=${function(){setSel(null);}}><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg></button></div>
        <span className="pl-i" style=${{width:56,height:56,fontSize:24}}>${p.name.charAt(0)}</span>
        <h3>${p.name}</h3>
        ${p.img?html`<figure className="fig"><img src=${p.img} alt=${p.name}/></figure>`:null}
        <dl>
          <div><dt>Category</dt><dd>${p.cat}</dd></div>
          <div><dt>Typical users</dt><dd>${p.users}</dd></div>
          <div><dt>What it emphasizes</dt><dd>${p.emph}</dd></div>
          <div><dt>What the category means</dt><dd className="tagx">${p.tags.map(function(t){return html`<div key=${t}><b>${t}.</b> ${TAGX[t]}</div>`;})}</dd></div>
          <div><dt>In this group</dt><dd>${GROUPS[p.group]}</dd></div>
        </dl>
        <div className="note">Classification reproduces the supplied training material. Functionality depends on edition, modules, integrations and contract. Verify against current vendor documentation.</div>
        <div className="sheet-nav"><button type="button" onClick=${function(){step(-1);}}>Previous</button><button type="button" onClick=${function(){step(1);}}>Next</button></div>
      </aside></div>`:null}
  </div>`;
}

function Block(p){
  var b=p.b;
  switch(b.t){
    case "p": return html`<p className="pp">${b.text}</p>`;
    case "lbl": return html`<p className="lbl">${b.text}</p>`;
    case "note": return html`<div className=${"note"+(b.tone==="todo"?" todo":"")}>${b.text}</div>`;
    case "answer": return html`<div className="answer"><b>Answer</b><p>${b.text}</p></div>`;
    case "chips": return html`<div className="stack">${b.label?html`<p className="lbl">${b.label}</p>`:null}<div className="chips">${b.items.map(function(x){return html`<span className="chip" key=${x}>${x}</span>`;})}</div></div>`;
    case "cols": return html`<div className="cols">${[b.l,b.r].map(function(c){return html`<div key=${c.title} className=${"col"+(c.tone==="warn"?" warn":"")}><h4>${c.title}</h4><ul>${c.items.map(function(x){return html`<li key=${x}>${x}</li>`;})}</ul></div>`;})}</div>`;
    case "cards": return html`<div className="cards">${b.items.map(function(c){return html`<div key=${c.title} className=${"card"+(c.tone==="warn"?" warn":"")}><h4>${c.title}</h4><p>${c.text}</p></div>`;})}</div>`;
    case "check": return html`<${Check} items=${b.items}/>`;
    case "rows": return html`<div className="rows">${b.items.map(function(r){return html`<div className="row" key=${r[0]}><b>${r[0]}</b><span>${r[1]}</span></div>`;})}</div>`;
    case "stairs": return html`<${Stairs} steps=${b.steps} proc=${true}/>`;
    case "example": return html`<${Example} b=${b}/>`;
    case "flips": return html`<${Flips} items=${b.items}/>`;
    case "platforms": return html`<${Explorer}/>`;
    case "img": return html`<figure className="fig"><img src=${b.src} alt=${b.caption||""}/>${b.caption?html`<figcaption>${b.caption}</figcaption>`:null}</figure>`;
    default: return null;
  }
}

function Point(p){
  var s=p.s, open=p.open;
  return html`<section className=${"pt"+(open?" open":"")} id=${"pt-"+s.id}>
    <button type="button" className="pt-h" aria-expanded=${open} onClick=${p.toggle}>
      <span className="pt-mark"></span><span className="pt-t">${s.title}</span><span className="pt-k">${s.kicker}</span><${Chev}/>
    </button>
    <${Collapse} open=${open}><div className="pt-body">${s.blocks.map(function(b,i){return html`<${Block} key=${i} b=${b}/>`;})}</div><//>
  </section>`;
}

function Waves(){
  var path="M0,60 C240,0 480,120 720,60 C960,0 1200,120 1440,60 C1680,0 1920,120 2160,60 C2400,0 2640,120 2880,60 L2880,120 L0,120 Z";
  function layer(fill,op,d,delay,rev){
    return html`<div className="wv" aria-hidden="true" style=${{"--d":d,animationDelay:delay,animationDirection:rev?"reverse":"normal",opacity:op}}>
      <svg viewBox="0 0 2880 120" preserveAspectRatio="none"><path d=${path} fill=${fill}/></svg></div>`;
  }
  return html`<div><div className="waves">${layer("#dcf3e7",1,"30s","-8s",false)}${layer("#16a870",0.55,"21s","-4s",true)}${layer("#0a7b50",1,"14s","-11s",false)}</div>
    <div className="wbase"><div className="wrap"><b>BPO Wizard</b><span>Database Training Document</span><span>Training Library / Phase 01</span></div></div></div>`;
}

function Footer(p){
  var prev=p.id>1?CH[p.id-2]:null, next=p.id<TOTAL?CH[p.id]:null;
  return html`<footer className="foot"><div className="wrap narrow"><div className="pager">
    <button type="button" className="pg" onClick=${function(){p.go(prev?prev.id:0);}}><small>${prev?"Previous chapter":"Back"}</small><b>${prev?prev.title:"Contents"}</b></button>
    <button type="button" className="pg next" onClick=${function(){p.go(next?next.id:0);}}><small>${next?"Next chapter":"Finished"}</small><b>${next?next.title:"Back to contents"}</b></button>
  </div></div><${Waves}/></footer>`;
}

function Chapter(p){
  var ch=p.ch;
  var st=useState(function(){var o={};o[ch.sections[0].id]=true;return o;}), open=st[0], setOpen=st[1];
  var allOpen=ch.sections.every(function(s){return open[s.id];});
  function setAll(v){var o={};ch.sections.forEach(function(s){o[s.id]=v;});setOpen(o);}
  function toggle(id){var o=Object.assign({},open);o[id]=!o[id];setOpen(o);}
  var num=(ch.id<10?"0":"")+ch.id;
  return html`<div className="page">
    <div className="wrap narrow">
      <div className="ch-h">
        <div className="eyebrow"><span className="dot"></span>Chapter ${num} / ${TOTAL}</div>
        <h2>${ch.title}</h2>
        ${ch.sub?html`<p className="lede" style=${{fontWeight:600}}>${ch.sub}</p>`:null}
        <p className="lede">${ch.lede}</p>
        ${ch.intro?html`<p className="intro">${ch.intro}</p>`:null}
      </div>
      <div className="ch-tools"><button type="button" className="hbtn" onClick=${function(){setAll(!allOpen);}}>${allOpen?"Collapse all":"Expand all"}</button><span>${ch.sections.length} points. Tap a box to open it.</span></div>
      <div className="pts">${ch.sections.map(function(s){return html`<${Point} key=${s.id} s=${s} open=${!!open[s.id]} toggle=${function(){toggle(s.id);}}/>`;})}</div>
      <div className=${"take"+(ch.long?" long":"")}><small>KEY TAKEAWAY</small><p>${ch.take}</p></div>
    </div>
    <${Footer} id=${ch.id} go=${p.go}/>
  </div>`;
}

function Home(p){
  return html`<div className="page">
    <div className="cover"><div className="wrap">
      <div className="eyebrow"><span className="dot"></span>Training Library / Phase 01</div>
      <h1><em>Database</em> Training Document</h1>
      <h2>Recruiting Database & ATS/CRM Playbook</h2>
      <p className="sub">The recruiting concept first. The recruiter workflow second. The technology that enables it third.</p>
      <div className="pillars">
        <div className="pillar"><small>01 / THE FOUNDATION</small><b>Structured records</b></div>
        <div className="pillar"><small>02 / THE PRACTICE</small><b>Connected workflows</b></div>
        <div className="pillar"><small>03 / THE ASSET</small><b>Talent relationships</b></div>
      </div>
      <div className="meta"><span>Project lead <b>Hasham</b></span><span>Team <b>Atif & Hani</b></span><span>10 chapters</span><span>Practical field guide</span></div>
    </div></div>
    <div className="wrap">
      <div className="sec-h"><h3>Contents</h3><p>Read, reference, reuse. Start at the beginning or jump to the chapter you need.</p></div>
      <div className="toc">${CH.map(function(c){
        var n=(c.id<10?"0":"")+c.id;
        return html`<button type="button" key=${c.id} className="tcard" onClick=${function(){p.go(c.id);}}>
          <span className="tnum">${n}<i></i></span><span className="tt">${c.title}</span><span className="ts">${c.lede}</span><span className="tgo">Read chapter <span>→</span></span></button>`;
      })}</div>
      <div className="intro-end"><b>A better database. A stronger recruiting practice.</b><span>A practical, recruiter-focused guide to building a trusted talent asset.</span></div>
    </div>
    <${Waves}/>
  </div>`;
}

function App(){
  function fromHash(){
    var m=/^#ch(\d+)$/.exec(window.location.hash||"");
    var n=m?parseInt(m[1],10):0;
    return n>=1&&n<=TOTAL?n:0;
  }
  var st=useState(fromHash), page=st[0], setPage=st[1];
  var bar=useRef(null);
  function go(n){
    setPage(n);
    try{window.location.hash=n?"ch"+n:"";}catch(e){}
    window.scrollTo(0,0);
  }
  useEffect(function(){
    function h(){setPage(fromHash());window.scrollTo(0,0);}
    window.addEventListener("hashchange",h);
    return function(){window.removeEventListener("hashchange",h);};
  },[]);
  useEffect(function(){
    function s(){
      var d=document.documentElement, max=d.scrollHeight-window.innerHeight;
      if(bar.current)bar.current.style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+"%";
    }
    s();
    window.addEventListener("scroll",s,{passive:true});
    window.addEventListener("resize",s);
    return function(){window.removeEventListener("scroll",s);window.removeEventListener("resize",s);};
  },[page]);
  return html`<div>
    <header className="hdr"><div className="wrap">
      <button type="button" className="logo" aria-label="BPO Wizard, back to contents" onClick=${function(){go(0);}}><img src=${LOGO} alt="BPO Wizard"/></button>
      <span className="hdr-t">${page?"Chapter "+page+" of "+TOTAL:"Database Training Document"}</span>
      <button type="button" className="hbtn" onClick=${function(){go(0);}}>Contents</button>
    </div><div className="prog" ref=${bar}></div></header>
    ${page===0?html`<${Home} key="home" go=${go}/>`:html`<${Chapter} key=${"c"+page} ch=${CH[page-1]} go=${go}/>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();
</script>
</body>
</html>
