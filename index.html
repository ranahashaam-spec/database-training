<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="BPO Wizard Database Training Document: a recruiting database and ATS/CRM playbook in 12 chapters.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%2316a870%27/%3E%3C/svg%3E">
<title>Database Training Document</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout concept: a sticky branded header over a single reading column. Contents page is a card grid; each chapter is a stack of point boxes that open to definitions, examples (stair tabs) and flip cards. Every page ends in an animated green wave. The brand motif is the green dot from the BPO Wizard logo. */
:root{
  --bg:#ffffff;
  --ink:#13201a;
  --ink2:#3b4a43;
  --muted:#64736c;
  --line:#e0eae4;
  --tint:#f0faf5;
  --tint2:#dcf3e7;
  --mint:#bfe3d0;
  --green:#16a870;
  --green-deep:#0a7b50;
  --green-dark:#07553a;
  --warn:#9a4a14;
  --warn-tint:#fdf1e7;
  --f-display:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:6px}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.narrow{max-width:880px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:14px;height:64px}
.logo{border:0;background:none;padding:0;display:flex;align-items:center;flex:none}
.logo img{height:28px;width:auto;display:block}
.hdr-t{margin-left:auto;font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.hbtn{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:600 13px var(--f-body);transition:background .2s,color .2s,border-color .2s}
.hbtn:hover{background:var(--green-deep);color:#fff;border-color:var(--green-deep)}
.prog{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:linear-gradient(90deg,var(--green),var(--green-deep))}
@media (max-width:640px){.hdr-t{display:none}.hbtn{margin-left:auto}}

.page{animation:pageIn .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* cover */
.cover{position:relative;padding-block:56px 36px;background:radial-gradient(circle at 88% 8%,var(--tint2),transparent 42%)}
.eyebrow{display:flex;align-items:center;gap:10px;font:500 12px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--green-deep)}
.dot{width:11px;height:11px;border-radius:50%;background:var(--green);display:inline-block;flex:none;box-shadow:0 0 0 0 rgba(22,168,112,.5);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(22,168,112,0)}100%{box-shadow:0 0 0 0 rgba(22,168,112,0)}}
.cover h1{margin:20px 0 10px;font:700 clamp(38px,7vw,80px)/1.02 var(--f-display);letter-spacing:-.035em;text-wrap:balance;max-width:14ch}
.cover h1 em{font-style:normal;color:var(--green-deep)}
.cover h2{margin:0 0 14px;font:600 clamp(18px,2.4vw,24px)/1.3 var(--f-display);letter-spacing:-.01em;color:var(--ink2);text-wrap:balance}
.cover .sub{max-width:58ch;color:var(--ink2);margin:0 0 28px;font-size:17px}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:0 0 24px}
.pillar{border-top:2px solid var(--green);padding-top:10px}
.pillar small{display:block;font:500 11px var(--f-mono);letter-spacing:.14em;color:var(--muted)}
.pillar b{font:600 18px var(--f-display)}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin:44px 0 18px}
.sec-h h3{margin:0;font:700 clamp(24px,3.4vw,34px)/1.15 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.sec-h p{margin:0;color:var(--muted);max-width:60ch}

.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.tcard{position:relative;display:flex;flex-direction:column;gap:10px;min-height:210px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:22px;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s}
.tcard::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--tint),var(--tint2));transform:translateY(101%);transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.tcard>*{position:relative}
.tcard:hover{transform:translateY(-4px);border-color:var(--green);box-shadow:0 16px 32px -16px rgba(10,123,80,.4)}
.tcard:hover::before{transform:none}
.tnum{font:600 13px var(--f-mono);color:var(--green-deep);display:flex;align-items:center;gap:8px}
.tnum i{display:block;height:2px;width:22px;background:var(--green);transition:width .3s}
.tcard:hover .tnum i{width:44px}
.tt{font:600 19px/1.25 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.ts{color:var(--ink2);font-size:15px}
.tgo{margin-top:auto;display:flex;align-items:center;gap:8px;font:600 13px var(--f-mono);color:var(--green-deep)}
.tgo span{transition:transform .25s}
.tcard:hover .tgo span{transform:translateX(6px)}
.intro-end{margin:40px 0 0;padding:22px 24px;border-radius:18px;background:var(--tint);display:flex;flex-wrap:wrap;gap:6px 24px;align-items:center}
.intro-end b{font:600 13px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--green-deep)}

/* chapter */
.ch-h{padding-block:44px 8px}
.ch-h h2{margin:14px 0 8px;font:700 clamp(30px,5vw,52px)/1.08 var(--f-display);letter-spacing:-.03em;text-wrap:balance}
.ch-h .lede{margin:0;font-size:18px;color:var(--ink2);max-width:60ch}
.ch-h .intro{margin:14px 0 0;color:var(--ink2);max-width:68ch}
.ch-tools{display:flex;gap:10px;margin:22px 0 18px;align-items:center;flex-wrap:wrap}
.ch-tools span{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.pts{display:grid;gap:12px}

.pt{border:1px solid var(--line);border-radius:16px;background:#fff;transition:border-color .25s,box-shadow .25s}
.pt:hover{border-color:var(--mint)}
.pt.open{border-color:var(--green);box-shadow:0 14px 32px -20px rgba(10,123,80,.45)}
.pt-h{width:100%;display:flex;align-items:center;gap:14px;padding:18px 20px;background:none;border:0;text-align:left}
.pt-mark{flex:none;width:13px;height:13px;border-radius:50%;border:2px solid var(--green);transition:background .25s,transform .25s}
.pt.open .pt-mark{background:var(--green);transform:scale(1.15)}
.pt-t{flex:1;min-width:0;font:600 clamp(17px,2.2vw,20px)/1.3 var(--f-display);letter-spacing:-.01em}
.pt-k{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
@media (max-width:560px){.pt-k{display:none}}
.chev{flex:none;color:var(--green-deep);transition:transform .3s}
.pt.open>.pt-h .chev,.ex.open>.ex-h .chev{transform:rotate(180deg)}
.pt-body{padding:2px 20px 22px;display:flex;flex-direction:column;gap:18px}
@media (max-width:560px){.pt-h{padding:16px 14px}.pt-body{padding:2px 14px 18px}}

.clp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.2,.7,.2,1)}
.clp.open{grid-template-rows:1fr}
.clp-in{min-height:0;overflow:hidden}
.clp:not(.open)>.clp-in{visibility:hidden;transition:visibility 0s .38s}

.pp{margin:0;max-width:68ch;color:var(--ink2)}
.lbl{font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--green-deep);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;background:var(--tint);border:1px solid var(--tint2);color:var(--green-dark);font-size:14px;font-weight:500;transition:background .2s,color .2s,transform .2s,border-color .2s}
.chip:hover{background:var(--green-deep);color:#fff;border-color:var(--green-deep);transform:translateY(-2px)}
.stack{display:flex;flex-direction:column;gap:10px}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.col{border-radius:14px;padding:16px 18px;background:var(--tint)}
.col.warn{background:var(--warn-tint)}
.col h4{margin:0 0 10px;font:600 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--green-deep)}
.col.warn h4{color:var(--warn)}
.col ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.col li{display:flex;gap:10px;align-items:flex-start}
.col li::before{content:"";flex:none;width:8px;height:8px;margin-top:9px;border-radius:50%;background:var(--green)}
.col.warn li::before{background:#d9803f}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:#fff;transition:transform .25s,border-color .25s,box-shadow .25s,background .25s}
.card:hover{transform:translateY(-3px);border-color:var(--green);background:var(--tint);box-shadow:0 12px 24px -16px rgba(10,123,80,.45)}
.card.warn{background:var(--warn-tint);border-color:#f0cfb3}
.card h4{margin:0 0 4px;font:600 16px var(--f-display);letter-spacing:-.005em}
.card p{margin:0;color:var(--ink2);font-size:15px}
.card .cw{font:700 13px var(--f-mono);color:var(--green-deep);display:block;margin-bottom:6px}

.ck{display:grid;gap:8px}
.ck-i{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;transition:background .2s,border-color .2s,transform .2s}
.ck-i:hover{border-color:var(--green);transform:translateX(3px)}
.ck-i.on{background:var(--tint);border-color:var(--mint)}
.ck-box{flex:none;width:22px;height:22px;margin-top:1px;border-radius:7px;border:2px solid var(--green);display:grid;place-items:center;color:#fff;transition:background .2s}
.ck-i.on .ck-box{background:var(--green-deep);border-color:var(--green-deep)}
.ck-box svg{opacity:0;transform:scale(.4);transition:opacity .2s,transform .2s}
.ck-i.on .ck-box svg{opacity:1;transform:none}
.ck-n{font:500 12px var(--f-mono);color:var(--muted)}

.rows{display:grid;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:6px 18px;padding:12px 16px;border-top:1px solid var(--line);transition:background .2s}
.row:first-child{border-top:0}
.row:hover{background:var(--tint)}
.row b{font:600 15px var(--f-display);color:var(--green-dark)}
.row span{color:var(--ink2)}
@media (max-width:520px){.row{grid-template-columns:1fr}}

.note{border-radius:12px;padding:12px 16px;background:var(--tint);color:var(--ink2);font-size:15px}
.note.todo{background:#fff;border:1.5px dashed var(--green);color:var(--green-dark)}
.answer{border-radius:14px;padding:16px 18px;background:var(--green-deep);color:#fff}
.answer b{display:block;font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.answer p{margin:0;font-weight:500}
.fig{margin:0}
.fig img{width:100%;border-radius:14px;display:block}
.fig figcaption{font-size:14px;color:var(--muted);margin-top:6px}

/* example box with stair tabs */
.ex{border-radius:14px;background:var(--tint);border:1px solid var(--tint2)}
.ex-h{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;background:none;border:0;text-align:left}
.ex-tag{flex:none;font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;background:var(--green-deep);color:#fff;padding:5px 10px;border-radius:6px}
.ex-t{flex:1;min-width:0;font-weight:600}
.ex-h:hover .ex-tag{background:var(--green)}
.ex-body{padding:4px 16px 18px;display:flex;flex-direction:column;gap:16px}
@media (max-width:560px){.ex-h{padding:12px}.ex-body{padding:4px 12px 14px}}
.stairs{list-style:none;margin:0;padding:0;display:grid;gap:8px;--step:20px}
@media (max-width:560px){.stairs{--step:8px}}
.stair{margin-left:calc(var(--i) * var(--step));min-width:0}
.stair-b{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:11px 14px;border:1px solid var(--tint2);border-bottom:4px solid var(--mint);border-radius:10px;background:#fff;transition:transform .2s,background .2s,color .2s,border-color .2s}
button.stair-b:hover{transform:translateX(4px)}
div.stair-b{cursor:default}
.stair.on .stair-b{background:var(--green-deep);border-color:var(--green-deep);border-bottom-color:var(--green-dark);color:#fff}
.sn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--tint2);color:var(--green-dark);font:600 12px var(--f-mono);display:grid;place-items:center}
.stair.on .sn{background:#fff;color:var(--green-deep)}
.sl{font-weight:600;min-width:0}
.stair-d{padding:10px 6px 4px 46px;color:var(--ink2)}
.stair-d p{margin:0 0 8px}
@keyframes stairIn{from{opacity:0;transform:translate(-20px,-12px)}to{opacity:1;transform:none}}
.ex.open .stair,.pt.open .proc .stair{animation:stairIn .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 70ms)}

.fun{display:grid;gap:8px}
.fun-r{display:grid;grid-template-columns:100px 1fr 40px;gap:10px;align-items:center;font-size:14px}
.fun-r b{font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:520px){.fun-r{grid-template-columns:78px 1fr 30px}}
.trk{height:22px;background:#fff;border-radius:6px;border:1px solid var(--tint2);overflow:hidden}
.bar{height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--green),var(--green-deep));transition:width 1s cubic-bezier(.2,.7,.2,1)}
.ex.open .bar,.ex.open .seg{width:var(--w)}
.split{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--tint2);background:#fff}
.seg{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.seg.a{background:var(--green-deep)}
.seg.b{background:var(--mint)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.cmp>div{background:#fff;border-radius:12px;padding:16px;border:1px solid var(--tint2)}
.cmp .big{font:700 clamp(26px,4vw,36px)/1 var(--f-display);letter-spacing:-.02em}
.cmp .bad .big{color:var(--warn)}
.cmp .good .big{color:var(--green-deep)}
.cmp small{display:block;color:var(--muted);margin:4px 0 10px;font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.cmp ul{margin:0;padding-left:18px;color:var(--ink2);font-size:15px}
.grp .parent{display:inline-block;padding:8px 16px;background:var(--green-deep);color:#fff;border-radius:10px;font-weight:600}
.grp .kids{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0 22px;padding-left:16px;border-left:2px solid var(--green)}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px;perspective:1200px}
.flip{padding:0;border:0;background:none;text-align:left;display:block;min-width:0}
.flip-in{display:grid;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.3,.7,.2,1)}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;display:flex;flex-direction:column;gap:8px;justify-content:space-between;min-height:132px;padding:16px 18px;border-radius:14px;-webkit-backface-visibility:hidden;backface-visibility:hidden;border:1px solid var(--line);transition:border-color .25s,box-shadow .25s}
.front{background:#fff}
.flip:hover .front{border-color:var(--green);box-shadow:0 12px 24px -16px rgba(10,123,80,.5)}
.back{background:var(--green-deep);color:#fff;border-color:var(--green-deep);transform:rotateY(180deg);justify-content:flex-start}
.flip-t{font:600 17px/1.25 var(--f-display)}
.flip-h{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--green-deep)}
.back .flip-h{color:#a8ecd0;margin-top:auto}
.bk{display:grid;gap:1px;font-size:14px}
.bk small{font:600 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:#a8ecd0}
.bk span{font-weight:500}

/* platform explorer */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;font:600 13px var(--f-body);transition:background .2s,color .2s,border-color .2s}
.tab:hover{border-color:var(--green)}
.tab[aria-pressed="true"]{background:var(--green-deep);color:#fff;border-color:var(--green-deep)}
.plats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.pl{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;min-width:0;padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff;transition:transform .25s,border-color .25s,box-shadow .25s}
.pl:hover{transform:translateY(-4px);border-color:var(--green);box-shadow:0 14px 26px -16px rgba(10,123,80,.5)}
.pl-i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--tint2);color:var(--green-dark);font:700 18px var(--f-display);transition:background .25s,color .25s,transform .25s}
.pl:hover .pl-i{background:var(--green-deep);color:#fff;transform:rotate(-8deg)}
.pl-n{font:600 17px var(--f-display)}
.pl-c{font:500 11px/1.4 var(--f-mono);letter-spacing:.06em;color:var(--muted)}
.pl-g{margin-top:auto;font:600 12px var(--f-body);color:var(--green-deep)}
.ov{position:fixed;inset:0;z-index:80;background:rgba(8,32,22,.45);animation:fade .25s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;top:0;right:0;bottom:0;z-index:90;width:min(480px,100%);overflow-y:auto;background:#fff;box-shadow:-20px 0 50px -20px rgba(8,32,22,.45);padding:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 24px;animation:slide .35s cubic-bezier(.2,.7,.2,1) both;display:flex;flex-direction:column;gap:18px}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;transition:background .2s,color .2s}
.x:hover{background:var(--green-deep);color:#fff}
.sheet h3{margin:0;font:700 32px/1.1 var(--f-display);letter-spacing:-.02em}
.sheet dl{margin:0;display:grid;gap:14px}
.sheet dt{font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--green-deep);margin-bottom:3px}
.sheet dd{margin:0;color:var(--ink2)}
.sheet .tagx{display:grid;gap:8px}
.sheet .tagx div{background:var(--tint);border-radius:10px;padding:10px 12px;font-size:15px}
.sheet .tagx b{color:var(--green-dark)}
.sheet-nav{display:flex;gap:10px;margin-top:auto}
.sheet-nav button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;transition:background .2s,border-color .2s}
.sheet-nav button:hover{background:var(--tint);border-color:var(--green)}

/* takeaway */
.take{position:relative;overflow:hidden;margin-top:30px;padding:28px;border-radius:20px;background:var(--green-deep);color:#fff}
.take::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.09)}
.take small{font:600 11px var(--f-mono);letter-spacing:.18em;color:#a8ecd0}
.take p{position:relative;z-index:1;margin:8px 0 0;font:600 clamp(20px,3vw,28px)/1.25 var(--f-display);letter-spacing:-.01em;max-width:34ch;text-wrap:balance}
.take.long p{font:500 clamp(16px,2vw,19px)/1.55 var(--f-body);max-width:70ch}

/* footer and wave */
.pager{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px}
.pg{flex:1 1 240px;min-width:0;display:grid;gap:2px;text-align:left;border:1px solid var(--line);border-radius:14px;padding:14px 18px;background:#fff;transition:border-color .2s,background .2s,transform .2s}
.pg.next{text-align:right}
.pg:hover{border-color:var(--green);background:var(--tint);transform:translateY(-2px)}
.pg small{font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pg b{font:600 16px var(--f-display)}
.waves{position:relative;height:clamp(90px,14vw,150px);margin-top:56px;overflow:hidden}
.wv{position:absolute;left:0;bottom:-1px;width:200%;height:100%;animation:wave var(--d) linear infinite}
.wv svg{display:block;width:100%;height:100%}
@keyframes wave{to{transform:translateX(-50%)}}
.wbase{background:var(--green-deep);color:#fff;padding-block:6px 20px}
.wbase .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.wbase span{opacity:.85}

/* tables, lists, flows, callouts */
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
.tbl th{background:var(--tint);color:var(--green-dark);font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;text-align:left;padding:11px 14px;white-space:nowrap}
.tbl td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top;color:var(--ink2)}
.tbl td:first-child{font:600 14.5px var(--f-display);color:var(--ink)}
.tbl tbody tr:hover td{background:var(--tint)}
.bul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bul li{display:flex;gap:10px;align-items:flex-start;color:var(--ink2);max-width:74ch;min-width:0}
.bul li::before{content:"";flex:none;width:8px;height:8px;margin-top:9px;border-radius:50%;background:var(--green)}
.card .bul{margin-top:8px;gap:6px;font-size:15px}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 2px;align-items:center}
.flow li{display:flex;align-items:center;gap:2px}
.flow li span{padding:8px 14px;border-radius:999px;background:var(--tint);border:1px solid var(--tint2);color:var(--green-dark);font-weight:600;font-size:14px;transition:background .2s,color .2s,transform .2s}
.flow li:hover span{background:var(--green-deep);color:#fff;transform:translateY(-2px)}
.flow li:not(:last-child)::after{content:"\2192";color:var(--green-deep);font-weight:700;padding:0 6px}
.call{border-radius:14px;padding:14px 18px;background:var(--tint);border:1px solid var(--tint2)}
.call b{display:block;font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--green-deep);margin-bottom:4px}
.call p{margin:0;color:var(--ink2);max-width:74ch}
.call.bpo{background:#fff;border:1.5px solid var(--green)}
.call.bpo b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:8px}
.call.warn{background:var(--warn-tint);border-color:#f0cfb3}
.call.warn b{color:var(--warn)}
.tabpanel{display:flex;flex-direction:column;gap:18px;padding-top:4px;animation:pageIn .4s cubic-bezier(.2,.7,.2,1) both}
.lnk{text-decoration:none}
.gl-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.gl-in{flex:1 1 260px;min-width:0;border:1px solid var(--line);border-radius:999px;padding:11px 18px;font:inherit;background:#fff;color:var(--ink)}
.gl-in:focus{outline:3px solid var(--green);outline-offset:1px;border-color:var(--green)}
.gl-az{display:flex;flex-wrap:wrap;gap:4px}
.gl-az button{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--line);background:#fff;font:600 12px var(--f-mono);transition:background .2s,color .2s}
.gl-az button:hover{border-color:var(--green)}
.gl-az button[aria-pressed="true"]{background:var(--green-deep);color:#fff;border-color:var(--green-deep)}
.gl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px}
.gl-i{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:#fff;display:grid;gap:4px;align-content:start;transition:border-color .2s,background .2s}
.gl-i:hover{border-color:var(--green);background:var(--tint)}
.gl-i b{font:600 16px var(--f-display)}
.gl-i p{margin:0;color:var(--ink2);font-size:15px}
.gl-n{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.howto{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;margin-top:40px;align-items:stretch}
@media (max-width:760px){.howto{grid-template-columns:minmax(0,1fr)}}
.howto h3{margin:0 0 10px;font:700 clamp(22px,3vw,28px)/1.15 var(--f-display);letter-spacing:-.02em}
.howto p{margin:0 0 10px;color:var(--ink2);max-width:62ch}
.core{border-radius:18px;background:var(--green-deep);color:#fff;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.core small{font:600 11px var(--f-mono);letter-spacing:.18em;color:#a8ecd0}
.core p{margin:0;color:#fff;font:600 clamp(20px,2.6vw,26px)/1.25 var(--f-display);letter-spacing:-.01em}
.flips{align-items:stretch}
.flip{height:100%;align-self:stretch}
.flip-in{height:100%}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .wv{animation:none!important}
}
</style>
</head>

 long:true,
 sections:[
 SEC("1a","What is a recruiting database?","Definition",[
  P("A recruiting database is a central system recruiters use to build and maintain a searchable pool of candidates and professional contacts, track their information and history, develop talent pipelines, manage relationships, and support current and future recruitment and business development opportunities."),
  P("Recruiting databases such as PCRecruiter, Loxo, and Crelate help recruiters organize information, identify relevant people, manage recruitment activities, maintain relationships, and make better use of information gathered over time."),
  P("Put simply, it is a structured collection of information about candidates and potential candidates, used for current and future hiring needs. It is more than résumés and contact details: it becomes a centralized source of recruiting information and candidate history.")]),
 SEC("1b","What information does a recruiting database contain?","6 groups",[
  P("A recruiting database contains much more than résumés and contact details. Depending on the system and how the client uses it, it may include the six groups of information below."),
  CHIPS(["Name and contact information","Current and previous companies and titles","Industry, skills and expertise","Location, education and certifications","Industry tags and candidate tags","Candidate status, pipelines and stages","Notes, communication and engagement history","Previous jobs, applications, interviews and sourcing activity","Who has spoken to the candidate","Preferences, availability, candidate source and team ownership"],"Quick view of one candidate record"),
  LC([
   {title:"1. Candidate information",items:["Names, contact details, résumés, and professional profiles.","Current and previous companies, job titles, and employment history.","Skills, expertise, industry experience, education, and certifications.","Location, availability, preferences, and career interests.","Candidate source and relevant tags or categories."]},
   {title:"2. Contact and company information",items:["Professional contacts, including recruiters, hiring managers, HR professionals, and decision-makers.","Contact details, job titles, responsibilities, and associated companies.","Company profiles, industries, locations, departments, and organizational information.","Relevant company intelligence, hiring activity, and business opportunities."]},
   {title:"3. Recruitment and job order information",items:["Current and historical job orders and their requirements.","Candidate profiles associated with specific job opportunities.","Candidate matching, screening, submission, and interview history.","Recruitment stages, job status, feedback, rejection reasons, and placement outcomes.","Relationships between candidates, job orders, companies, and contacts."]},
   {title:"4. Communication and relationship history",items:["Notes, emails, calls, meetings, and follow-up records.","Previous conversations and engagement history.","Who has communicated with a candidate or contact and what was discussed.","Candidate and contact preferences, interests, and relationship status.","Relevant feedback, commitments, and next steps."]},
   {title:"5. Pipelines, statuses, and activity tracking",items:["Candidate and contact statuses.","Recruitment and engagement pipelines.","Previous sourcing, applications, submissions, and interview activity.","Assigned team members and record ownership.","Tasks, reminders, pending actions, and follow-up dates, where supported."]},
   {title:"6. Data organization and reliability",items:["Tags, categories, custom fields, and searchable attributes.","Information sources and verification details, where recorded.","Record updates, duplicate identification, and data-quality indicators.","Last-contact or last-updated information, where available.","Access permissions and appropriate handling of personal information."]}
  ])]),
 SEC("1c","How these records work together","Connections",[
  P("The value of a recruiting database comes not only from the information stored in individual records, but also from the relationships between them. For example, a recruiter may use the database to:"),
  UL(["Find candidates who match a current job order.","Identify a contact associated with a target company.","Review whether a candidate has previously been approached, submitted, interviewed, or placed.","Understand previous interactions before contacting a candidate or client contact again.","Revisit candidates who were unsuitable for an earlier role but may fit a future opportunity.","Identify relevant companies, contacts, and talent for future recruitment or business development activity.","Continue work from existing records instead of repeating research unnecessarily."]),
  CALL("key","A recruiting database is a centralized, searchable resource for candidate and contact information, company intelligence, recruitment history, professional relationships, and ongoing opportunities. Its value lies in helping recruiters find relevant people, understand their history, manage relationships, connect people with opportunities, and reuse reliable information to support current and future work."),
  CALL("bpo","When working in a client’s recruiting database, the objective is not simply to find, enter, or update records. It is to understand how the information supports the client’s recruitment and business development processes and to maintain accurate, useful records that the client and team can rely on.")]),
 SEC("1d","Why does a recruiting database matter?","Value",[
  P("A recruiting database helps recruiters make better use of the information they collect, the research they conduct, and the relationships they build. Its value goes beyond storing records: it helps make previous work reusable and supports current and future recruitment needs."),
  {t:"cols",
   l:{title:"For recruiters",items:["Find relevant candidates faster by searching existing records before starting new research.","Reuse previous recruiting work instead of repeatedly sourcing the same people.","Understand candidate history by reviewing previous interactions, submissions, interviews, feedback, and outcomes.","Identify candidates for other roles by matching existing profiles to new job requirements.","Track contacts and follow-ups to maintain continuity in communication and relationships.","Build and maintain talent pipelines for current and future hiring needs.","Re-engage candidates when a suitable opportunity becomes available.","Identify relevant professional contacts and companies to support recruitment and business development.","Avoid duplicate work and missed opportunities by checking existing records and activity before taking action."]},
   r:{title:"For recruiting firms and the business",items:["Reduce repetitive sourcing and research by making previous work accessible and reusable.","Improve recruiter productivity by reducing time spent searching for information already available.","Support faster client delivery by helping recruiters identify relevant candidates and contacts more efficiently.","Preserve organizational knowledge so useful information remains accessible even when team members change.","Build long-term talent assets through searchable candidate pools and maintained professional relationships.","Improve service quality through better access to candidate history, previous outcomes, and client-related information.","Handle similar or recurring requirements more efficiently by reusing relevant research and existing talent pipelines.","Reduce dependence on individual memory by documenting information, interactions, and next steps in a shared system.","Support better decisions by making historical information and recruitment outcomes available for review.","Create business development opportunities by helping recruiters identify relevant companies, contacts, and relationships."]}},
  CALL("key","A recruiting database is a business asset, not just an operational tool. Its value depends on how effectively recruiters use and maintain it to improve productivity, preserve knowledge, strengthen relationships, support service quality, and identify future opportunities.","Business perspective: the key idea"),
  CALL("bpo","The quality of our work is not measured only by the information we find or the records we update. It also depends on whether the work creates lasting value for our clients by making their recruiting information accurate, searchable, reusable, and useful for future opportunities.")]),
 SEC("1e","Previous work stays reusable","Example",[
  P("Candidates who were not hired for one role often remain relevant to the next one. A searchable history makes that previous work reusable."),
  EX("100 Project Managers sourced",[{label:"Sourced",text:"A recruiter previously sourced 100 Project Managers."},{label:"Placed",text:"10 of them were placed."},{label:"Not placed",text:"The remaining 90 may still be suitable for future opportunities."},{label:"Reused",text:"By searching the existing database, the recruiter can identify relevant candidates, review their previous history, and decide whom to approach again, rather than starting the search from scratch."}],
   {viz:{type:"split",parts:[{label:"10 placed",v:10,c:"a"},{label:"90 not placed",v:90,c:"b"}]},
    note:"These figures illustrate reuse. They are not measured performance claims. The database does not guarantee that all 90 candidates remain available or suitable. It provides a starting point for further verification and qualification."})]),
 SEC("1f","How a database saves time and creates long-term value","5 advantages",[
  CARDS([
   {title:"Time-saving advantage",text:"Recruiters can reuse previous research instead of repeatedly finding the same types of candidates."},
   {title:"Long-term advantage",text:"Information collected today can stay useful for future roles. A candidate who is not suitable today may be suitable six months later."},
   {title:"Knowledge retention",text:"The database stores useful knowledge such as previous conversations, candidate preferences, and why someone was not selected."},
   {title:"Faster client response",text:"Relevant talent may already be in the system, allowing the recruiting team to respond to requirements faster."},
   {title:"Relationship building",text:"Recruiters can maintain relationships rather than treating every interaction as a one-time transaction."}])]),
 SEC("1g","Talent mapping and pipeline building","Concept",[
  P("Talent mapping means identifying and organizing potential talent by industry, function, company, geography, skills, or seniority."),
  CHIPS(["Private Equity","Investment Banking","Venture Capital","Asset Management"],"Example: a financial-services recruiting firm continuously maps professionals across"),
  P("Pipeline building means developing a group of potential candidates who may be relevant for current or future opportunities."),
  EX("An example pipeline",TX(["50 Construction Project Managers identified","30 relevant to the firm’s market","20 contacted","12 interested","8 suitable for current or future opportunities"]),
   {viz:{type:"funnel",items:[["Identified",50],["Relevant",30],["Contacted",20],["Interested",12],["Suitable",8]]}}),
  FLOW(["New requirement","Start sourcing","Build market","Contact candidates"],"Without a pipeline"),
  FLOW(["New requirement","Search pipeline","Review history","Engage","Source gaps"],"With a pipeline"),
  CALL("key","With an existing pipeline, a new requirement can start with existing talent instead of starting a completely new sourcing exercise.","Why it saves time")]),
 SEC("1h","Risks and limits","Balance",[
  UL(["Outdated information can reduce confidence in the database.","Duplicate records can create confusion and waste time.","Poor searchability makes useful data hard to find.","Too much unstructured data can make records difficult to use.","The database needs regular maintenance and quality control."]),
  CALL("warn","Building a database is not the end goal. Maintaining a usable, accurate, searchable database is what creates value.")]),
 SEC("1i","Why database quality matters more than size","Quality over quantity",[
  P("A large database is not automatically a good database. The real question is how effectively the team can use it to serve a recruiting requirement."),
  EX("500,000 candidates or 100,000?",[{label:"Database A",text:"500,000 candidates with many duplicates, outdated records, poor classification, difficult searching and little history."},{label:"Database B",text:"100,000 candidates with accurate information, regular maintenance, clear tags and classifications, easy searching and clear candidate history."},{label:"The result",text:"Database B is the more useful asset, even though it is smaller."}],
   {viz:{type:"compare",
     a:{big:"500,000",small:"Database A: candidates",tone:"bad",items:["Many duplicates","Outdated records","Poor classification","Difficult to search","Little history"]},
     b:{big:"100,000",small:"Database B: candidates",tone:"good",items:["Accurate information","Regularly maintained","Clear tags and classifications","Easy to search","Clear candidate history"]}},
    note:"Illustrative comparison from the training material."}),
  CALL("key","Clients need relevant talent, not simply a large database count. Quality should be measured by usefulness, accuracy, searchability, and relevance.","Client-service view")]),
 SEC("1j","Important database components","Reference",[
  TB(["Component","What it does"],[
   ["Industry tags","Group candidates by industry experience, such as Financial Services, Manufacturing, or Construction."],
   ["Candidate tags","Flexible labels such as Passive Candidate, PMP, Immediate Availability, Open to Relocation, or High Priority."],
   ["Pipelines","Groups of candidates being developed or considered for a recruiting purpose."],
   ["Stages","Show where a candidate is in the recruiting process."],
   ["Candidate history","Past roles, applications, interviews, sourcing activity, recruiter conversations, submissions, and outcomes."]]),
  FLOW(["Sourced","Contacted","Spoken To","Interested","Submitted","Interview","Offer","Hired"],"Example stages")]),
 SEC("1k","Recruiting language and candidate statuses","Reference",[
  P("Use consistent recruiting language so everyone understands the same candidate status."),
  TB(["Term","Meaning"],[
   ["Sourced","Candidate identified as potentially relevant."],
   ["Contacted","Recruiter has reached out."],
   ["Spoken To","Recruiter has had a direct conversation with the candidate."],
   ["Engaged","Candidate is actively responding or communicating."],
   ["Interested","Candidate has shown interest in an opportunity."],
   ["Submitted","Candidate has been presented for a role."],
   ["Interviewed","Candidate has entered the interview process."],
   ["Rejected","Candidate was not selected."],
   ["Withdrawn","Candidate exited the process."],
   ["Hired","Candidate accepted or completed the hiring process."],
   ["Re-engaged","Previously known candidate contacted again for a new opportunity."],
   ["Nurtured","Relationship maintained for future opportunities."],
   ["Passive candidate","Not actively looking, but may consider the right opportunity."],
   ["Active candidate","Currently open to or actively seeking opportunities."]])])
 ]},

/* ============ 2 ============ */
{id:2,title:"ATS vs. recruiting CRM",
 lede:"ATS: who are we hiring right now? CRM: who might we hire now or in the future?",
 take:"ATS: who are we hiring right now? CRM: who might we hire now or in the future? The difference is purpose, process management versus relationship management, not the type of person stored. Many modern platforms combine both.",
 long:true,
 sections:[
 SEC("2a","How recruiting technology evolved","Background",[
  CHIPS(["Résumés","Email","Spreadsheets","Paper files","Separate notes"],"Where recruiting started"),
  P("As hiring volumes grew, it became harder to keep candidate information organized and to track the hiring process manually. Recruiting software was introduced to centralize candidate information and make hiring easier to manage. Over time, two major system types became common: the ATS and the Recruiting CRM."),
  TB(["System","Main purpose"],[["ATS","Manage applicants and the active hiring process."],["Recruiting CRM","Build, organize, and maintain relationships with talent."]]),
  CALL("warn","Modern platforms may combine both ATS and CRM capabilities. The difference is mainly about the system’s primary purpose and workflow, not simply the type of person stored in it.")]),
 SEC("2b","ATS: Applicant Tracking System","Definition",[
  CALL("key","How can recruiters organize applications and manage candidates through the hiring process? Instead of tracking applicants manually across emails and spreadsheets, recruiters could keep candidate records and hiring activity in one place.","The problem the ATS was created to solve"),
  FLOW(["Job opening","Application","Screening","Interview","Decision","Hire"],"Traditional ATS flow"),
  P("The traditional ATS centered on the active job and moved candidates through defined stages."),
  UL(["Manage open positions and requisitions.","Collect and organize applications.","Store résumés and candidate profiles.","Track candidate stages.","Record interviews, feedback, and decisions.","Maintain recruiting records."],"A traditional ATS is used to")]),
 SEC("2c","How ATS use has expanded","History",[
  P("A modern ATS may also contain valuable recruiting history. Old records can include candidates who applied, were sourced, interviewed, submitted, rejected, hired, or considered for another role. Past recruiting activity can create future recruiting value."),
  P("When a new requirement arrives, recruiters can search historical records before starting from zero. The goal is not to assume an old candidate is still suitable; it is to identify people worth reviewing and re-engaging."),
  EX("Searching ATS history for a construction role",[{label:"Earlier work",text:"A recruiter previously sourced 50 Project Managers for a construction role."},{label:"A similar role opens",text:"Six months later, a similar role opens."},{label:"Search history",text:"The recruiter searches those historical records and reviews experience and previous notes."},{label:"Re-engage",text:"Suitable candidates are re-engaged."},{label:"Source gaps",text:"Only then does the recruiter source externally for the remaining gaps."}]),
  TB(["Use","What it means"],[["Active hiring","Manage candidates for current openings."],["Historical search","Find candidates from previous recruiting activity."],["Sourcing support","Use existing candidate records before starting new external sourcing."]],"The ATS today")]),
 SEC("2d","Recruiting CRM: candidate relationship management","Definition",[
  P("Recruiting became more proactive over time. Recruiters realized that valuable talent is not limited to people who are currently applying for jobs."),
  UL(["A strong candidate may already be employed.","A candidate may not be actively job searching.","A person may have been contacted for a previous role.","Someone interviewed before may be a fit for a future role.","One candidate may be relevant to several roles over time."]),
  CALL("key","How can we build and maintain relationships with potential candidates so we can engage them when the right opportunity appears? A CRM therefore supports longer-term talent engagement rather than only managing applicants for one open position.","The problem the recruiting CRM was created to solve"),
  UL(["Build and organize talent pools.","Manage passive candidates.","Track outreach and relationship history.","Support talent mapping and future pipelines.","Nurture candidates until the right opportunity appears.","Re-engage candidates for future roles."],"A recruiting CRM today"),
  P("Recruiters can organize talent using factors such as industry, function, skills, location, seniority, candidate status, and relationship history.")]),
 SEC("2e","How ATS and CRM work together","Workflow",[
  CALL("key","ATS = hiring process. CRM = talent relationship.","The easiest way to think about it"),
  P("A recruiter receives a new VP Finance requirement. Both systems can provide useful information, but they are used from different angles."),
  TB(["ATS perspective","CRM perspective"],[
   ["Search current applicants","Search passive VP Finance talent"],
   ["Review previous applicants","Review existing talent pools"],
   ["Check candidates from similar roles","Check people previously contacted"],
   ["Review previous interview or hiring history","Review relationship and outreach history"],
   ["Re-engage suitable historical candidates","Nurture or re-engage for the right opportunity"]],"Example: VP Finance requirement"),
  FLOW(["Source","Add","Enrich","Classify","Engage","Track","Reuse"],"Typical combined workflow"),
  P("A candidate may first be identified and nurtured through a CRM, then move into an active hiring workflow when they become relevant to a specific job.")]),
 SEC("2f","ATS and CRM at a glance","Tap to flip",[
  {t:"flips",items:[
   {title:"Primary purpose",back:[["ATS","Manage hiring"],["Recruiting CRM","Manage talent relationships"]]},
   {title:"Main focus",back:[["ATS","Active vacancies"],["Recruiting CRM","Current and future talent"]]},
   {title:"Starting point",back:[["ATS","Job / requisition"],["Recruiting CRM","Candidate / talent"]]},
   {title:"Main question",back:[["ATS","Who are we hiring?"],["Recruiting CRM","Who might we hire?"]]},
   {title:"Passive candidates",back:[["ATS","May be included"],["Recruiting CRM","Major focus"]]},
   {title:"Historical candidates",back:[["ATS","Useful to search"],["Recruiting CRM","Core talent pool"]]},
   {title:"Candidate nurturing",back:[["ATS","Secondary"],["Recruiting CRM","Major function"]]},
   {title:"Sourcing",back:[["ATS","Supports active hiring"],["Recruiting CRM","Supports proactive talent building"]]},
   {title:"Pipeline",back:[["ATS","Usually job-specific"],["Recruiting CRM","Can be long-term"]]}]},
  CALL("warn","Do not define the ATS as “applicants” and the CRM as “candidates.” Both can contain candidate records. The key difference is the purpose: process management versus relationship management.")]),
 SEC("2g","Why companies may prefer one over the other","Choosing",[
  P("The right choice depends on the business model and the recruiting problem, not on the feature list."),
  TB(["Situation","Likely emphasis","Why"],[
   ["A company mostly fills roles as they open and receives many applications","ATS","It needs structure for applications, stages, interview feedback, and hiring decisions."],
   ["A team that regularly recruits people who are not applying","CRM","It needs to build pools, track outreach, and nurture relationships before a role exists."],
   ["A staffing or search firm managing client jobs and candidates","Combined ATS and CRM, built for agencies","It must manage candidates, client contacts, job orders, submissions, and placements together."],
   ["A large employer linking recruiting to wider HR processes","ATS inside an HR suite","It needs approvals, compliance, and links to onboarding and workforce planning."],
   ["A team that has an ATS but wants stronger nurturing","A CRM layer on top","It adds talent pools, outreach, and re-engagement without replacing the hiring workflow."]]),
  CARDS([
   {title:"An ATS fits",text:"Job-led hiring with structured stages, feedback, and decisions."},
   {title:"A CRM fits",text:"Proactive recruiting, passive talent, mapping, and long-term pipelines."},
   {title:"Combined platforms",text:"Connect nurturing with active hiring and retain history in one place."}])]),
 SEC("2h","Why many modern platforms combine both","Convergence",[
  P("Talent does not stay in one state. A person can be a passive prospect in March, an applicant in June, a finalist in July, and a silver medalist for a different role the following year. Platforms combine ATS and CRM functions so that one record can follow the person through all of those moments."),
  UL(["One record per person, instead of a prospect record in one system and an applicant record in another.","History carries forward from nurturing to application, interview, and outcome.","Fewer duplicate records and less duplicate outreach.","Recruiters search once and see both active and historical talent.","Reporting can follow the whole journey, from first contact to hire.","Teams can move a nurtured person into a live job workflow without re-entering data."],"Reasons platforms combine the two"),
  NOTE("Examples covered in Chapter 9 include Lever, Ashby, Gem, and Avature for employers, and Bullhorn, Crelate, Loxo, and Recruit CRM for agencies. Exact functionality depends on edition, modules, integrations, and contract.")])
 ]},

/* ============ 3 ============ */
{id:3,title:"How recruiters use databases",
 lede:"New job. Search existing database. Review previous talent. Engage. Track. Reuse.",
 take:"New job. Search existing database. Review previous talent. Engage. Track. Reuse. Searching first turns previous work into saved time, and clear records let any recruiter continue the work.",
 sections:[
 SEC("3a","A repeatable recruiter workflow","Process",[
  FLOW(["New job","Search existing database","Review previous talent","Engage","Track","Reuse"]),
  P("Tap each step to see what the recruiter actually does."),
  STAIRS([
   {label:"New job",text:"A new requirement arrives. Clarify the role first: job family, essential skills, seniority, industry experience, location and work arrangement, credentials, and any genuine constraints. Separate what is essential from what is only preferred."},
   {label:"Search existing database",text:"Search before sourcing. Use job titles, related titles, keywords, Boolean search, and filters across pipelines, previous applicants, sourced candidates, interviewees, silver medalists, and past placements."},
   {label:"Review previous talent",text:"Open the strongest records. Review résumés, employment history, recruiter notes, previous submissions, feedback, stated preferences, reasons for declining, and the last-contact date. Revalidate anything time-sensitive."},
   {label:"Engage",text:"Contact the people worth re-engaging with a concise, personalized message. Then source externally for the remaining gaps, using approved platforms and documenting where each person came from."},
   {label:"Track",text:"Record the conversation, response, stage change, agreed next step, owner, and follow-up date, so another recruiter can continue the work."},
   {label:"Reuse",text:"Keep the record useful for the next requirement: add new qualified people, tag them for future roles, and note the job-related reason for any non-selection."}])]),
 SEC("3b","Worked example: a construction role","Example",[
  EX("Fifty Project Managers, six months later",[
   {label:"The role opens",text:"Six months after sourcing 50 Project Managers, a similar construction role opens."},
   {label:"Search first",text:"Search those records before any new sourcing."},
   {label:"Review",text:"Review experience and notes, and decide who is worth re-engaging."},
   {label:"Engage and fill gaps",text:"Contact suitable people and source remaining gaps externally."},
   {label:"Record",text:"Record interest and stage changes so the next role starts with existing talent."}])]),
 SEC("3c","The end-to-end recruiting workflow","Table",[
  P("The database is used at every step of the work, not only at the start."),
  TB(["Step","Owner action","Control point"],[
   ["Intake","Clarify outcomes, requirements, location, seniority, and exclusions.","Requirements are specific and approved."],
   ["Account and market analysis","Understand target organizations, structure, and the talent market.","Evidence-based target list and hierarchy."],
   ["Database-first search","Search existing ATS/CRM records before new sourcing.","Prior candidates reviewed."],
   ["External sourcing","Use approved platforms and targeted search logic.","Source is appropriate and documented."],
   ["Research and enrichment","Verify identity, role, experience, and contact fields.","Required fields and verification status checked."],
   ["Shortlist","Compare evidence against role criteria.","Consistent, job-related evaluation."],
   ["Outreach and screening","Contact candidates and document responses.","Preferences and communication rules followed."],
   ["Submit and interview","Associate candidates with the requisition and coordinate stages.","Records and feedback complete."],
   ["Outcome and reuse","Record decisions and appropriate future context.","Outcome factual; future contact appropriate."],
   ["Audit and clean","Review duplicates, errors, stale data, and access issues.","Corrections traceable."]])]),
 SEC("3d","Database-first search in practice","Habit",[
  P("Searching the existing database before external sourcing is the habit that turns previous work into saved time. It also reduces the chance that two recruiters approach the same person without knowing it."),
  UL(["Search by title, related titles, skills, industry, and location, not by one exact phrase.","Look at who has already been contacted, submitted, interviewed, or placed, and by whom.","Treat an old record as a lead to review, not as proof of present fit or interest.","Record what the search found, even when it found nothing, so the effort is visible.","Source externally only for the gaps, and add the new qualified people to the database."]),
  CALL("warn","Searching first does not mean accepting old records at face value. Review suitability and revalidate details before presenting or advancing anyone.")]),
 SEC("3e","Team handoff standards","Continuity",[
  P("A recruiter should be able to pick up another recruiter’s work without calling them. That depends on consistent notes and statuses."),
  UL(["Use consistent notes and status definitions so another recruiter can continue the work.","Record next action, owner, and due date.","Keep source links and verification state easy to find.","Explain decisions and unresolved questions without speculation.","Escalate uncertain identities, duplicate conflicts, restricted data, and system errors."]),
  TB(["A weak note","A usable note"],[
   ["Not a fit.","Not selected for the Finance Director role: no direct manufacturing experience. Strong in shared-services finance. Consider for future shared-services roles."],
   ["Called, no answer.","Called the mobile number from the source profile, no answer; sent a short email. Next action: call again Thursday. Contact verification: unverified."],
   ["Good guy.","Led a team of 8 on regional tax reporting (per résumé). Open to relocation (stated by the candidate)."]],"Example: the same information, written two ways")])
 ]},

/* ============ 4 ============ */
{id:4,title:"Database lifecycle",
 lede:"Source → Add → Enrich → Classify → Engage → Update → Reuse → Clean. Eight stages that keep a database trusted.",
 take:"A recruiting database is not valuable merely because candidate records have been collected. Its value comes from a repeatable lifecycle: source relevant talent, add it centrally, enrich it carefully, classify it consistently, engage appropriately, update it with new evidence, reuse it for future requirements, and clean it continuously. The objective is a trusted talent asset that helps recruiters make better decisions and respond faster, without sacrificing accuracy, candidate experience, or responsible data handling.",
 long:true,
 sections:[
 SEC("4a","Overview: a continuous practice","Overview",[
  FLOW(["Source","Add","Enrich","Classify","Engage","Update","Reuse","Clean"]),
  P("A recruiting database creates value when candidate information moves through a controlled lifecycle. Sourcing identifies potentially relevant people; adding and enrichment turn findings into usable records; classification makes records searchable; engagement develops relationships; and ongoing updating, reuse, and cleaning keep the database reliable over time."),
  {t:"flips",items:[
   {title:"1. Source",back:[["Core question","Where can we identify relevant talent?"],["Expected outcome","A relevant candidate or potential-candidate lead"]]},
   {title:"2. Add",back:[["Core question","How do we capture the person in the central system?"],["Expected outcome","One traceable candidate record, linked to its source"]]},
   {title:"3. Enrich",back:[["Core question","What information is missing, inconsistent, or unverified?"],["Expected outcome","A more complete, matched, standardized, and checked record"]]},
   {title:"4. Classify",back:[["Core question","How will recruiters find and interpret this person later?"],["Expected outcome","Consistent fields, tags, taxonomy, provenance, and access labels"]]},
   {title:"5. Engage",back:[["Core question","How do we build or continue a professional relationship?"],["Expected outcome","Recorded outreach, responses, follow-ups, and next actions"]]},
   {title:"6. Update",back:[["Core question","What has changed since the record was last reviewed?"],["Expected outcome","Current details and a clear update history"]]},
   {title:"7. Reuse",back:[["Core question","Could this person fit another current or future requirement?"],["Expected outcome","Faster shortlisting and less duplicated sourcing effort"]]},
   {title:"8. Clean",back:[["Core question","Is this record accurate, unique, appropriate, and usable?"],["Expected outcome","A trusted database with errors and duplicates resolved"]]}]},
  CALL("key","The lifecycle is continuous, not a one-way checklist. A candidate may be re-sourced, re-enriched, reclassified, re-engaged, or cleaned whenever new information or a new hiring requirement appears.","Important principle")]),
 SEC("4b","Stage 1. Source: identify relevant candidates","Stage 1",[
  P("Sourcing is the process of finding people whose skills, experience, industry background, location, or career level may fit a current or future hiring requirement. Recruiters should begin with the job criteria and choose sources that are likely to contain relevant evidence, not simply collect as many profiles as possible."),
  TB(["Source category","Examples","Recruiting use"],[
   ["Professional networks","LinkedIn; LinkedIn Recruiter; Sales Navigator where appropriate","Search current and past titles, employers, skills, seniority, location, and professional connections. Sales Navigator is designed for sales and account research, so use it for professional discovery only where it fits the workflow and permitted use."],
   ["Talent and contact discovery tools","ZoomInfo Talent; Apollo; ContactOut; SalesQL; Juicebox","Discover people or locate professional contact details; may support filtering and enrichment. Tool coverage and confidence vary, so results need checking."],
   ["Recruiting marketplaces and job boards","Indeed; CareerBuilder and other relevant job boards","Find active job seekers, applicants, résumés, or profiles available through the service and subscription."],
   ["Employer and professional websites","Company leadership and team pages, professional biographies, association directories, conference speaker pages","Confirm role, employer, specialization, credentials, and public professional history."],
   ["Professional portfolios and publications","GitHub, portfolio sites, published articles, research pages, conference talks","Assess relevant work, technical skills, domain expertise, or specialist experience when appropriate to the role."],
   ["Existing internal records","ATS/CRM, prior applicants, interview records, silver medalists, past placements, previous outreach","Find previously researched talent before starting a new external search."],
   ["Referrals and networks","Employee referrals, trusted professional recommendations, industry contacts","Discover people through a relevant professional connection and improve context for outreach."],
   ["Candidate-initiated channels","Applications, careers-page submissions, event sign-ups, opt-in talent communities","Capture people who have expressed interest or submitted information directly."]],"Common candidate sourcing channels"),
  STAIRS(TX(["Clarify the requirement: job family, must-have skills, seniority, industry, geography, work arrangement, credentials, and any genuine constraints.","Build a search plan: select two or more suitable sources when necessary, and define search terms, title variations, target employers, and inclusion and exclusion criteria.","Search systematically: combine title synonyms, skills, industry, company, location, and seniority. Use Boolean logic where the platform supports it.","Review the evidence: distinguish a plausible match from a confirmed match. A title alone is not proof of current responsibilities or skill depth.","Capture the source: record the originating platform or URL, the date found, and the recruiter or workflow responsible for the record.","Preserve future value: if someone is not right for this vacancy, record the job-related reason and whether they may fit another role, without making unsupported or unfair labels."])),
  EX("Sourcing example: a Senior Tax Manager",[
   {label:"The requirement",text:"Senior Tax Manager with corporate tax experience in a U.S. manufacturing business."},
   {label:"Find and confirm",text:"A recruiter may search LinkedIn for relevant titles and employers, use a professional biography to confirm specialization, and use an approved contact-discovery tool to identify a work email."},
   {label:"A near miss",text:"A person who lacks the required manufacturing background may still be valuable for another tax role if the record clearly explains the fit and limitation."}]),
  CALL("key","Source relevance comes before volume. Record only information that is relevant, appropriately obtained, and permitted by the organization’s policies and the source’s terms.","Quality checkpoint")]),
 SEC("4c","Stage 2. Add: capture the candidate centrally","Stage 2",[
  P("Adding, also called data ingestion and centralization, means bringing candidate information from separate sources into the recruiting system so the team can find and manage it in one place. The goal is a reliable central record, not a copy-and-paste archive."),
  UL(["Identity: full name and, where available, a stable professional profile URL.","Professional snapshot: current title, current employer, location, job family, industry, and relevant skills.","Contact channels: professional email or phone only where appropriately sourced and needed for the recruiting purpose.","Source and provenance: source platform, original profile or record URL, date captured, and how information entered the system.","Recruiting context: target role or talent pool, recruiter owner, current status, and concise job-related notes.","Governance fields: consent or contact preference where applicable, opt-out and suppression status, data sensitivity, and review date."],"What should be captured"),
  TB(["Method","How it works","Control to apply"],[
   ["Manual entry","A recruiter reviews a source and enters relevant fields.","Use required fields and a consistent format; verify high-impact details."],
   ["Résumé or profile parsing","Software extracts structured fields from a résumé or profile document.","Treat extracted values as suggestions; check names, dates, titles, and employer boundaries."],
   ["Import or bulk upload","Records enter through a spreadsheet or approved export.","Map columns carefully, test a small batch, check duplicates, and preserve source fields."],
   ["Integration or API","Connected systems exchange candidate fields.","Define field ownership, permissions, sync direction, error handling, and audit history."],
   ["Candidate self-submission","A person submits an application or profile form.","Capture the submission date, source, stated preferences, and any required privacy notice."]],"Ways information enters a database"),
  CALL("warn","A record should not be considered complete simply because it has been saved. It must be distinguishable from other people, traceable to its source, and structured so another recruiter can understand and use it.")]),
 SEC("4d","Stage 3. Enrich: improve the usefulness of the record","Stage 3",[
  P("Enrichment adds missing professional context, improves consistency, connects information that belongs to the same person, and checks whether important details are reliable. Enrichment should improve decision-making, not create the appearance of certainty from unverified data."),
  TB(["Enrichment step","What it means","Recruiter-focused example or control"],[
   ["1. Data ingestion and centralization","Bring relevant data from approved sources into the designated ATS/CRM or controlled staging area.","Import the profile and source URL into the central system instead of leaving the only copy in a personal spreadsheet."],
   ["2. Parsing and extraction","Extract fields from résumés, public professional profiles, or other permitted documents.","Convert a résumé into name, employers, titles, dates, education, and skills; manually review parsing errors."],
   ["3. De-duplication and standardization (mandatory)","Detect repeated records and normalize formats, labels, and values.","Merge or link duplicate records only after confirming they represent the same person; standardize title spelling, dates, locations, and phone formats."],
   ["4. External identity resolution and matching (mandatory)","Compare attributes across sources to determine whether records refer to the same individual.","Compare name, current and past employer, title, location, profile URL, and professional contact details. A name match alone is insufficient."],
   ["5. Data appending (mandatory)","Add relevant missing fields from reliable, permitted sources.","Append a verified work email, current role, company website, specialization, or location, while retaining the source and date."],
   ["6. Validation and verification","Check whether fields are plausible, correctly formatted, current, and supported by evidence.","Validate email syntax and deliverability where an approved verifier is available; confirm the person still works at the listed company before outreach."],
   ["7. Continuous syncing and scoring","Refresh connected fields where supported and prioritize records using transparent quality or relevance rules.","A system may flag a profile for review after a job change or lower a freshness score when no field has been checked for a long period. Automation does not guarantee correctness."]]),
  UL(["Prefer first-party or authoritative professional evidence for current employment and credentials; use contact-data tools as leads to verify, not as unquestionable truth.","Keep the source and last-verified date for important fields. A current title may be confirmed today while a phone number remains unverified.","Separate verified facts from recruiter observations, candidate statements, and automated predictions.","Do not overwrite a reliable value silently when sources conflict. Compare evidence, record the decision, and escalate unresolved conflicts.","Collect only information needed for a legitimate recruiting purpose. Do not add sensitive personal information merely because a tool makes it available.","Use approved systems, subscriptions, integrations, and data-handling practices. Respect access controls, source terms, candidate preferences, and applicable privacy requirements."],"How to enrich without creating false confidence"),
  EX("Enrichment example: Jordan Lee",[
   {label:"Initial record",text:"“Jordan Lee, Finance Manager, Chicago.”"},
   {label:"After review",text:"The recruiter confirms a current employer and professional profile, standardizes the title to the organization’s title taxonomy, adds relevant industry experience, records the source URL and verification date, and validates the work email using an approved process."},
   {label:"What stays unverified",text:"A phone number from a third-party source that cannot be confirmed should remain marked unverified or be omitted, not presented as confirmed."}])]),
 SEC("4e","Stage 4. Classify: make records searchable and governed","Stage 4",[
  P("Classification organizes candidate information into consistent fields, categories, and access labels. It helps recruiters retrieve the right talent, understand why a person is relevant, and handle information according to its sensitivity."),
  TB(["Classification dimension","What it organizes","Examples"],[
   ["Role and function","Job families and functional specialization","Software Engineering, Product Management, Sales, Tax, Accounting, Legal, Finance"],
   ["Seniority level","Career stage and scope","Junior, Mid-Level, Senior, Manager, Director, VP, Executive"],
   ["Skill type","Specific capability and skill category","Technical: Python, SQL. Functional: corporate tax. Soft and leadership: people management, stakeholder communication"],
   ["Industry or domain","Business environments in which experience was gained","Manufacturing, Financial Services, Healthcare, SaaS, Professional Services"],
   ["Location and work arrangement","Relevant geography and work conditions","Chicago, New York, remote, hybrid; relocation preference only when appropriately obtained"],
   ["Credentials","Relevant licenses, certifications, or qualifications","CPA, PMP, relevant technical certifications"],
   ["Candidate status","Recruiting stage or relationship state","Sourced, Contacted, Engaged, Active Applicant, Passive Talent, Silver Medalist, Hired, Do Not Contact"],
   ["Availability and preferences","Candidate-stated timing or opportunity preferences","Notice period, preferred role, work arrangement, relocation preference. Record date and source"],
   ["Relationship and history","Previous interactions and outcomes","Contacted for Role A, interviewed in May, declined due to location, follow-up requested in December"]],"A. Classification by talent taxonomy"),
  TB(["Information class","Examples","Handling principle"],[
   ["Public or professional information","Public professional biography, work history, published portfolio, public professional profile","Still use for a defined recruiting purpose; public availability does not remove all privacy or terms-of-use obligations."],
   ["Internal recruiting information","Recruiter notes, outreach history, interview feedback, internal pipeline status","Restrict access to staff with a legitimate business need; keep notes factual, relevant, and professional."],
   ["Confidential personal information","Personal contact details, home address, compensation expectations, private candidate documents","Collect only when necessary; restrict access, define retention, and avoid broad exports."],
   ["Highly restricted or regulated information","Background-check results or protected demographic and equal-opportunity data where lawfully collected","Use separate approved workflows and strict role-based access; never expose it in ordinary sourcing notes or search tags."],
   ["Preference and restriction flags","Opt-out, do-not-contact, consent or communication preference where applicable","Make the restriction visible to permitted users and ensure outreach workflows honor it."]],"B. Classification by security and sensitivity"),
  TB(["Classification layer","What it organizes","Core examples"],[
   ["Profile sections","The layout of a candidate record","Personal and contact, professional, recruiter notes, compensation, location"],
   ["Talent taxonomy","How recruiters search and group talent","Role and function, seniority, industry, skills, credentials"],
   ["Data provenance","Where information came from and how it was obtained","Candidate-submitted, recruiter-verified, public professional source, approved enrichment tool, imported record"],
   ["Temporal state","Whether information is historical or current","Previous role versus current role; last verified date; review due date"],
   ["Compliance and access layer","Who may access or use a field and under what restriction","Restricted field, masked personal data, opt-out flag, retention review"]],"C. The complete classification summary"),
  CALL("key","Use agreed picklists and naming conventions wherever possible. For example, do not classify the same role as “Sr Tax Mgr,” “Senior Tax Manager,” and “Sr. Tax Manager” in three separate categories if the database can map them to one standard value. Keep the original wording in a source or history field when it is useful.","Standardization rule")]),
 SEC("4f","Tags, fields, notes, status, and history","Where things go",[
  P("Recruiters often put the right information in the wrong place. Knowing what each part of a record is for makes records searchable and understandable to the next person."),
  TB(["Element","What it is for","A good example","A common mistake"],[
   ["Field","A structured value in a defined place. Best for anything you will filter or report on.","Title: Senior Tax Manager. Location: Dallas. Seniority: Senior Manager.","Burying title, skills, or industry in free-text notes where search cannot find them."],
   ["Tag","A flexible label that cuts across fields. Best for attributes that do not have their own field.","Passive Candidate, PMP, Open to Relocation, Future Cloud Role.","Inventing a new tag for each case instead of using the team’s agreed list."],
   ["Note","Factual context that does not fit a field: what was said, why, and what happens next.","Not selected for the Finance Director role: no direct manufacturing experience.","Opinions, speculation, or personal comments that are not job-related."],
   ["Status","Where the person is in a process or relationship right now.","Interested; Follow-up requested; Do Not Contact.","Leaving an old status in place after the situation has changed."],
   ["Candidate history","The timeline of applications, submissions, interviews, outreach, and outcomes.","Applied in March, interviewed in April, finalist, not selected.","Losing or overwriting history when merging or editing records."],
   ["Source and provenance","Where the information came from and when it was checked.","Profile URL, date captured, verification status.","Recording a value with no source or date, so nobody can tell how reliable it is."]])]),
 SEC("4g","Stage 5. Engage: build and maintain relationships","Stage 5",[
  P("Engagement is the process of communicating with candidates, recording interactions, and managing appropriate follow-ups. It includes outreach for a current role and longer-term relationship-building for future opportunities. Engagement automation should support timely, relevant communication, not send messages without regard to candidate preference or context."),
  UL(["Personalize outreach around the candidate’s relevant experience and the actual opportunity; avoid unsupported claims about fit.","Record the date, channel, role or talent pool, message outcome, candidate response, and agreed next step.","Use consistent statuses such as Contacted, Responded, Interested, Not Interested, Follow-up Requested, Nurturing, and Do Not Contact.","Set a follow-up date only when appropriate. Respect a request not to be contacted or a preference to reconnect later.","Keep notes concise, factual, job-related, and understandable to another recruiter.","When a candidate is not right for one role, capture the reason in a fair, specific way and consider other roles only if relevant."],"Core engagement practices"),
  TB(["Capability","How it can help","Important guardrail"],[
   ["Automated data freshness campaigns","Create review tasks for records that have not been checked within a defined period.","A reminder is not proof that the data has been updated; record the actual verification."],
   ["Career milestone and promotion triggers","Flag possible job changes or promotions that may create a reason to refresh a record or reconnect.","Treat external signals as prompts for human review, not confirmed facts."],
   ["Smart matching and silver-medalist reactivation","Compare past candidates with new requirements and surface people who performed well previously.","Reassess current skills, interest, availability, and role fit before outreach."],
   ["Self-service candidate portals","Allow candidates to update profiles, preferences, résumés, or contact details themselves.","Show when the candidate last updated information and control access to the submission."],
   ["Automated profile completeness scoring","Identify missing required fields and prioritize records for improvement.","Completeness is not accuracy; a full record can still contain wrong information."],
   ["Real-time webhook and external API syncing","Move updates between connected systems and reduce repetitive entry.","Define the source of truth for each field, manage failures, and retain audit history."],
   ["Two-way SMS and chatbot ingestion","Capture replies, availability, basic screening answers, and contact preferences through approved channels.","Provide clear identity and context, respect communication preferences, and route complex issues to a recruiter."],
   ["Recruiter action and pipeline alerts","Prompt a recruiter when a follow-up is due, a candidate replies, or a record enters a stage.","Assign an owner and escalation rule so alerts are actionable rather than noise."]],"Engagement automation and advanced capabilities"),
  EX("An example engagement sequence",[
   {label:"Identify",text:"A recruiter identifies a passive Finance Director for a future talent pool."},
