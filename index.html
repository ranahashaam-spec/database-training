/* ---------- glossary ---------- */
var GLOSS=[
 ["Account analysis","Researching a company’s business model, structure, locations, leadership, and function scope to make searches and matches more accurate."],
 ["Active candidate","A candidate who is currently open to or actively seeking opportunities."],
 ["API","Application programming interface. A documented way for software systems to exchange information, such as candidate data between an ATS/CRM and another tool."],
 ["Applicant","A person who has applied for a specific job."],
 ["Applicant Tracking System (ATS)","Software that manages open positions, applications, candidate stages, interviews, feedback, decisions, and hiring records."],
 ["Boolean search","A search method that uses AND, OR, NOT, quotation marks, and parentheses to combine or exclude terms."],
 ["Candidate experience","How a candidate experiences the recruiting process, including the clarity of communication and respect for their preferences."],
 ["Candidate history","Past roles, applications, interviews, sourcing activity, recruiter conversations, submissions, and outcomes recorded for a person."],
 ["Candidate nurturing","Maintaining a relationship with a candidate over time through relevant, appropriate communication, so they can be engaged when the right opportunity appears."],
 ["Candidate pipeline","An organized set of candidates moving through stages or maintained for future opportunities."],
 ["Candidate record","The central profile for one person in the database, holding their information, history, and status."],
 ["Candidate Relationship Management (CRM)","The practice and software for building, organizing, and maintaining relationships with candidates and other recruiting contacts over time, not only while a role is open."],
 ["Candidate source","Where a candidate was found, such as a job board, professional network, referral, or career fair."],
 ["Classification","Organizing records into consistent fields, categories, tags, and access labels so they can be found and handled correctly."],
 ["Client","The organization a recruiter or agency is hiring for."],
 ["Contact","A professional in the database who is not necessarily a candidate, such as a hiring manager, HR professional, or decision-maker."],
 ["Contingency search","A search where the recruiter is paid only if the client hires a candidate the recruiter presented."],
 ["CRM","Customer Relationship Management. In recruiting, software that supports ongoing talent and client relationships."],
 ["Custom field","A field added by the client or team to store information the system does not hold by default."],
 ["Data decay","The gradual loss of accuracy as people change employers, titles, locations, and contact details."],
 ["Data enrichment","Adding or improving data fields using reliable evidence, such as a verified employer, role, skills, or contact details."],
 ["Data governance","The policies and controls for how recruiting data is collected, used, accessed, retained, and deleted."],
 ["Data provenance","Information about where a data point came from and when it was checked."],
 ["Database","A structured collection of information about candidates and potential candidates, used for current and future hiring needs."],
 ["Do Not Contact (DNC)","A flag meaning no outreach should be made to a person. It should stay visible to permitted users."],
 ["Duplicate","More than one record for the same person. Confirm with several identifiers before merging; a matching name alone is not sufficient."],
 ["Duplicate resolution","Confirming and safely resolving multiple records for the same person, by merging, linking, or flagging them."],
 ["Engagement","Communicating with candidates and recording interactions, follow-ups, and next steps."],
 ["Executive search","Recruiting for senior leadership roles, often through targeted, relationship-led approaches."],
 ["Field","A defined place in a record for one kind of information, such as title, employer, or location."],
 ["Funnel","The stages candidates move through from sourced to hired, used to see where candidates progress or exit."],
 ["HCM","Human capital management. Software covering HR processes such as payroll, onboarding, and talent management. An HCM suite may include recruiting."],
 ["Hiring manager","The person in the client organization who owns the open role and makes the hiring decision."],
 ["HRIS","Human resources information system. Software that stores employee records and may integrate with an ATS/CRM."],
 ["Identity resolution","Comparing attributes across sources to decide whether records refer to the same person."],
 ["Integration","A connection that lets two systems share data, such as a native connector, API, webhook, or middleware."],
 ["Interview scorecard","A structured form for recording interviewer feedback against defined criteria."],
 ["Job order","A client’s request to fill a position, with its requirements. Corporate systems often call this a requisition."],
 ["MCP","Model Context Protocol. A connector standard that can let AI assistants access permitted data or approved actions in other systems."],
 ["Merge","Combining confirmed duplicate records into one while preserving useful history."],
 ["Middleware","A service such as Zapier that connects supported applications without custom code."],
 ["Native integration","A ready-made connector provided by the ATS/CRM vendor or a technology partner."],
 ["Offer","A formal proposal of employment made to a selected candidate."],
 ["Opt-out","A person’s request not to be contacted. It must be recorded and honored."],
 ["Passive candidate","A potentially relevant professional who is not necessarily actively seeking a role."],
 ["PII","Personally identifiable information. Information that can identify a person, such as name, contact details, or home address, handled under privacy rules."],
 ["Pipeline stage","A defined step in a pipeline, such as Sourced, Contacted, Interested, Submitted, Interview, Offer, or Hired."],
 ["Placement","A candidate hired into a role through a recruiter or agency."],
 ["Quality of hire","A measure of how well a hire performs and fits after joining. Organizations define and measure it differently."],
 ["Re-engagement","Contacting a previously known candidate again about a new opportunity."],
 ["Recruiting CRM","Software that organizes talent pools, passive candidates, outreach history, and future pipelines for relationship-based recruiting."],
 ["Recruitment marketing","Promoting an employer and its jobs to attract candidates, for example through career sites and campaigns."],
 ["Referral","A candidate recommended by a trusted person, such as an employee or an industry contact."],
 ["Requisition","A formal request to fill a position. In an ATS, it usually starts the hiring process."],
 ["Résumé parsing","Software that extracts employers, titles, dates, and skills from a résumé into structured fields."],
 ["Retained search","An executive search engagement where the client pays the firm to run a dedicated search, often for senior roles."],
 ["Retention schedule","The policy for how long records may be kept before they are reviewed or deleted."],
 ["RPO","Recruitment process outsourcing. Hiring a provider to run all or part of an employer’s recruiting."],
 ["Search brief","A clear summary of job criteria prepared before searching, separating essential requirements from preferences."],
 ["Seniority","A person’s level and scope in their career, such as junior, senior, manager, director, or executive."],
 ["Shortlist","The strongest candidates selected after comparing evidence against the role criteria."],
 ["Silver medalist","A strong finalist who was not selected and may fit a future role."],
 ["Source of truth","The system or field treated as the authoritative record when the same information exists in more than one place."],
 ["Sourcing","The process of finding people whose skills, experience, and background may fit a current or future requirement."],
 ["Status","A label for where a person is in a process or relationship right now."],
 ["Submission","Presenting a candidate to a client or hiring manager for a role. Also called a submittal."],
 ["Suppression list","A list of people who must not be contacted, such as those who have opted out."],
 ["Tag","A flexible label applied to a record to make it searchable, such as PMP or Passive Candidate."],
 ["Talent acquisition","The broader practice of attracting, finding, and hiring talent, usually inside an organization."],
 ["Talent community","A group of interested people who opt in to hear from an employer about future opportunities."],
 ["Talent intelligence","Use of external data, automation, or AI to discover, enrich, segment, and analyze talent."],
 ["Talent mapping","Structured analysis of relevant talent in a defined market or industry, organized by industry, function, company, geography, skills, or seniority."],
 ["Talent pipeline","A group of potential candidates developed for current or future opportunities."],
 ["Talent pool","A group of people with shared relevant characteristics, such as skills, function, or industry, maintained for hiring."],
 ["Taxonomy","A shared classification structure for fields, tags, skills, industries, and roles."],
 ["Time to fill","The number of days from when a job requisition is opened or approved to when an offer is accepted. Organizations choose the start point differently, so confirm the client’s definition."],
 ["Time to first qualified shortlist","The time from a new requirement to the first set of qualified candidates. Define “qualified” consistently."],
 ["Time to hire","The number of days from when a candidate first enters the process, such as an application or first contact, to when they accept the offer. Definitions vary, so confirm the client’s definition."],
 ["Validation and verification","Checking that fields are plausible, correctly formatted, current, and supported by evidence."],
 ["VMS","Vendor management system. Software employers use to manage staffing suppliers and contingent workers."],
 ["Webhook","An automatic notification one application sends to another when an event happens, such as a candidate moving to a new stage."],
 ["Workflow","A repeatable series of steps for completing recruiting work, such as intake, search, review, outreach, and tracking."]
];
GLOSS.sort(function(a,b){return a[0].toLowerCase()<b[0].toLowerCase()?-1:1;});


/* ---------- small components ---------- */
function Chev(){return html`<svg className="chev" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>`;}
function Tick(){return html`<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>`;}

function Collapse(p){
  return html`<div className=${"clp"+(p.open?" open":"")}><div className="clp-in">${p.children}</div></div>`;
}

function Stairs(p){
  var steps=p.steps, hasLabel=steps.some(function(s){return s.label;});
  var st=useState(hasLabel?0:-1), act=st[0], setAct=st[1];
  return html`<ol className=${"stairs"+(p.proc?" proc":"")}>${steps.map(function(s,i){
    var on=act===i;
    var tags=s.tags?html`<div className="chips">${s.tags.map(function(t){return html`<span className="chip" key=${t}>${t}</span>`;})}</div>`:null;
    if(s.label){
      return html`<li key=${i} className=${"stair"+(on?" on":"")} style=${{"--i":i}}>
        <button type="button" className="stair-b" aria-expanded=${on} onClick=${function(){setAct(on?-1:i);}}>
          <span className="sn">${i+1}</span><span className="sl">${s.label}</span>
        </button>
        <${Collapse} open=${on}><div className="stair-d"><p>${s.text}</p>${tags}</div><//>
      </li>`;
    }
    return html`<li key=${i} className="stair" style=${{"--i":i}}>
      <div className="stair-b"><span className="sn">${i+1}</span><span className="sl" style=${{fontWeight:500}}>${s.text}</span></div>
    </li>`;
  })}</ol>`;
}

function Viz(p){
  var v=p.v;
  if(v.type==="funnel"){
    var max=v.items[0][1];
    return html`<div className="fun">${v.items.map(function(it,i){
      return html`<div className="fun-r" key=${i}><span>${it[0]}</span><div className="trk"><div className="bar" style=${{"--w":(it[1]/max*100)+"%",transitionDelay:(i*90)+"ms"}}></div></div><b>${it[1]}</b></div>`;
    })}</div>`;
  }
  if(v.type==="split"){
    return html`<div><div className="split">${v.parts.map(function(pt,i){return html`<div key=${i} className=${"seg "+pt.c} style=${{"--w":pt.v+"%"}}></div>`;})}</div>
      <div className="legend">${v.parts.map(function(pt,i){return html`<span key=${i}><i style=${{background:pt.c==="a"?"var(--green-deep)":"var(--mint)"}}></i>${pt.label}</span>`;})}</div></div>`;
  }
  if(v.type==="compare"){
    var side=function(o){return html`<div className=${o.tone}><div className="big">${o.big}</div><small>${o.small}</small><ul>${o.items.map(function(x){return html`<li key=${x}>${x}</li>`;})}</ul></div>`;};
    return html`<div className="cmp">${side(v.a)}${side(v.b)}</div>`;
  }
  if(v.type==="group"){
    return html`<div className="grp"><span className="parent">${v.parent}</span><div className="kids">${v.kids.map(function(k){return html`<span className="chip" key=${k}>${k}</span>`;})}</div></div>`;
  }
  return null;
}

function Example(p){
  var st=useState(false), open=st[0], setOpen=st[1];
  return html`<div className=${"ex"+(open?" open":"")}>
    <button type="button" className="ex-h" aria-expanded=${open} onClick=${function(){setOpen(!open);}}>
      <span className="ex-tag">Example</span><span className="ex-t">${p.b.title}</span><${Chev}/>
    </button>
    <${Collapse} open=${open}>
      <div className="ex-body">
        ${p.b.viz?html`<${Viz} v=${p.b.viz}/>`:null}
        <${Stairs} steps=${p.b.steps}/>
        ${p.b.note?html`<div className="note">${p.b.note}</div>`:null}
      </div>
    <//>
  </div>`;
}

function Check(p){
  var st=useState({}), on=st[0], setOn=st[1];
  var n=p.items.filter(function(_,i){return on[i];}).length;
  return html`<div className="stack"><div className="ck">${p.items.map(function(t,i){
    return html`<button type="button" key=${i} className=${"ck-i"+(on[i]?" on":"")} aria-pressed=${!!on[i]} onClick=${function(){var c=Object.assign({},on);c[i]=!c[i];setOn(c);}}>
      <span className="ck-box"><${Tick}/></span><span>${t}</span></button>`;
  })}</div><span className="ck-n">${n} of ${p.items.length} reviewed. Tap a point to tick it off.</span></div>`;
}

function Flips(p){
  var st=useState({}), on=st[0], setOn=st[1];
  return html`<div className="flips">${p.items.map(function(it,i){
    return html`<button type="button" key=${i} className=${"flip"+(on[i]?" on":"")} aria-pressed=${!!on[i]} onClick=${function(){var c=Object.assign({},on);c[i]=!c[i];setOn(c);}}>
      <span className="flip-in">
        <span className="face front"><span className="flip-t">${it.title}</span><span className="flip-h">Tap to reveal details</span></span>
        <span className="face back">${it.back.map(function(r){return html`<span className="bk" key=${r[0]}><small>${r[0]}</small><span>${r[1]}</span></span>`;})}<span className="flip-h">Turn back</span></span>
      </span></button>`;
  })}</div>`;
}

function Explorer(){
  var a=useState("All"), g=a[0], setG=a[1];
  var b=useState(null), sel=b[0], setSel=b[1];
  var list=PLAT.filter(function(x){return g==="All"||x.group===g;});
  useEffect(function(){
    if(sel===null)return;
    var prev=document.body.style.overflow;
    document.body.style.overflow="hidden";
    function k(e){if(e.key==="Escape")setSel(null);}
    window.addEventListener("keydown",k);
    return function(){document.body.style.overflow=prev;window.removeEventListener("keydown",k);};
  },[sel]);
  var p=sel===null?null:PLAT[sel];
  function step(d){
    var idx=list.findIndex(function(x){return x===PLAT[sel];});
    if(idx<0){setSel(PLAT.indexOf(list[0]));return;}
    setSel(PLAT.indexOf(list[(idx+d+list.length)%list.length]));
  }
  var groupNames=["All","Enterprise suite","Corporate and growth","Agency"];
  return html`<div className="stack">
    <div className="tabs" role="group" aria-label="Filter platforms">${groupNames.map(function(n){return html`<button type="button" key=${n} className="tab" aria-pressed=${g===n} onClick=${function(){setG(n);}}>${n}</button>`;})}</div>
    ${g!=="All"?html`<div className="note">${GROUPS[g]}</div>`:null}
    <div className="plats">${list.map(function(x){
      return html`<button type="button" key=${x.name} className="pl" onClick=${function(){setSel(PLAT.indexOf(x));}}>
        <span className="pl-i">${x.name.charAt(0)}</span><span className="pl-n">${x.name}</span><span className="pl-c">${x.cat}</span><span className="pl-g">${x.group}</span></button>`;
    })}</div>
    ${p?ReactDOM.createPortal(html`<div><div className="ov" onClick=${function(){setSel(null);}}></div>
      <aside className="sheet" role="dialog" aria-modal="true" aria-label=${p.name+" details"}>
        <div className="sheet-top"><span className="lbl">${p.group}</span>
          <button type="button" className="x" aria-label="Close details" onClick=${function(){setSel(null);}}><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg></button></div>
        <span className="pl-i" style=${{width:56,height:56,fontSize:24}}>${p.name.charAt(0)}</span>
        <h3>${p.name}</h3>
        ${p.img?html`<figure className="fig"><img src=${p.img} alt=${p.name}/></figure>`:null}
        <dl>
          <div><dt>Category</dt><dd>${p.cat}</dd></div>
          <div><dt>ATS, CRM or both</dt><dd>${p.kind}</dd></div>
          <div><dt>What it is</dt><dd>${p.what}</dd></div>
          <div><dt>Who typically uses it</dt><dd>${p.users}</dd></div>
          <div><dt>Recruiting problem it solves</dt><dd>${p.problem}</dd></div>
          <div><dt>Key database and relationship capabilities</dt><dd>${p.caps}</dd></div>
          <div><dt>AI applications</dt><dd>${p.ai}</dd></div>
          <div><dt>Integrations</dt><dd>${p.integ}</dd></div>
          <div><dt>What makes it different</dt><dd>${p.diff}</dd></div>
          <div><dt>Recruiter example</dt><dd>${p.ex}</dd></div>
          ${p.news?html`<div><dt>Recent change</dt><dd>${p.news}</dd></div>`:null}
          <div><dt>Category meaning</dt><dd className="tagx">${p.tags.map(function(t){return html`<div key=${t}><b>${t}.</b> ${TAGX[t]}</div>`;})}</dd></div>
        </dl>
        <div className="chips"><a className="chip lnk" href=${p.site} target="_blank" rel="noopener noreferrer">Official website</a></div>
        <div className="note">Checked against vendor sources in November 2026. Functionality depends on edition, modules, integrations and contract. Verify against current vendor documentation before relying on it.</div>
        <div className="sheet-nav"><button type="button" onClick=${function(){step(-1);}}>Previous</button><button type="button" onClick=${function(){step(1);}}>Next</button></div>
      </aside></div>`,document.body):null}
  </div>`;
}

function Tabbed(p){
  var st=useState(0), i=st[0], setI=st[1];
  var it=p.items[i];
  return html`<div className="stack">
    <div className="tabs" role="group" aria-label=${p.label||"Choose one"}>${p.items.map(function(t,k){return html`<button type="button" key=${t.name} className="tab" aria-pressed=${i===k} onClick=${function(){setI(k);}}>${t.name}</button>`;})}</div>
    <div className="tabpanel" key=${i}>${it.blocks.map(function(b,k){return html`<${Block} key=${k} b=${b}/>`;})}</div>
  </div>`;
}

function Glossary(){
  var a=useState(""), q=a[0], setQ=a[1];
  var b=useState(""), L=b[0], setL=b[1];
  var letters=[];
  GLOSS.forEach(function(g){var c=g[0].charAt(0).toUpperCase();if(letters.indexOf(c)<0)letters.push(c);});
  var ql=q.trim().toLowerCase();
  var list=GLOSS.filter(function(g){
    if(L&&g[0].charAt(0).toUpperCase()!==L)return false;
    if(!ql)return true;
    return g[0].toLowerCase().indexOf(ql)>=0||g[1].toLowerCase().indexOf(ql)>=0;
  });
  return html`<div className="stack">
    <div className="gl-bar">
      <input id="gl-q" className="gl-in" type="search" placeholder="Search terms and definitions" aria-label="Search the glossary" value=${q} onChange=${function(e){setQ(e.target.value);}}/>
    </div>
    <div className="gl-az" role="group" aria-label="Filter by letter">
      <button type="button" aria-pressed=${L===""} onClick=${function(){setL("");}}>All</button>
      ${letters.map(function(c){return html`<button type="button" key=${c} aria-pressed=${L===c} onClick=${function(){setL(L===c?"":c);}}>${c}</button>`;})}
    </div>
    <span className="gl-n">${list.length} of ${GLOSS.length} terms</span>
    <div className="gl-list">${list.map(function(g){return html`<div className="gl-i" key=${g[0]}><b>${g[0]}</b><p>${g[1]}</p></div>`;})}</div>
    ${list.length===0?html`<div className="note">No terms match. Try a shorter word or clear the letter filter.</div>`:null}
  </div>`;
}

function Block(p){
  var b=p.b;
  switch(b.t){
    case "p": return html`<p className="pp">${b.text}</p>`;
    case "lbl": return html`<p className="lbl">${b.text}</p>`;
    case "note": return html`<div className=${"note"+(b.tone==="todo"?" todo":"")}>${b.text}</div>`;
    case "answer": return html`<div className="answer"><b>Answer</b><p>${b.text}</p></div>`;
    case "chips": return html`<div className="stack">${b.label?html`<p className="lbl">${b.label}</p>`:null}<div className="chips">${b.items.map(function(x){return html`<span className="chip" key=${x}>${x}</span>`;})}</div></div>`;
    case "cols": return html`<div className="cols">${[b.l,b.r].map(function(c){return html`<div key=${c.title} className=${"col"+(c.tone==="warn"?" warn":"")}><h4>${c.title}</h4><ul>${c.items.map(function(x){return html`<li key=${x}>${x}</li>`;})}</ul></div>`;})}</div>`;
    case "cards": return html`<div className="cards">${b.items.map(function(c){return html`<div key=${c.title} className=${"card"+(c.tone==="warn"?" warn":"")}><h4>${c.title}</h4><p>${c.text}</p></div>`;})}</div>`;
    case "check": return html`<${Check} items=${b.items}/>`;
    case "rows": return html`<div className="rows">${b.items.map(function(r){return html`<div className="row" key=${r[0]}><b>${r[0]}</b><span>${r[1]}</span></div>`;})}</div>`;
    case "stairs": return html`<${Stairs} steps=${b.steps} proc=${true}/>`;
    case "example": return html`<${Example} b=${b}/>`;
    case "flips": return html`<${Flips} items=${b.items}/>`;
    case "platforms": return html`<${Explorer}/>`;
    case "img": return html`<figure className="fig"><img src=${b.src} alt=${b.caption||""}/>${b.caption?html`<figcaption>${b.caption}</figcaption>`:null}</figure>`;
    case "ul": return html`<div className="stack">${b.label?html`<p className="lbl">${b.label}</p>`:null}<ul className="bul">${b.items.map(function(x,i){return html`<li key=${i}>${x}</li>`;})}</ul></div>`;
    case "table": return html`<div className="stack">${b.label?html`<p className="lbl">${b.label}</p>`:null}<div className="tblw"><table className="tbl"><thead><tr>${b.head.map(function(h){return html`<th key=${h} scope="col">${h}</th>`;})}</tr></thead><tbody>${b.rows.map(function(r,i){return html`<tr key=${i}>${r.map(function(c,k){return html`<td key=${k}>${c}</td>`;})}</tr>`;})}</tbody></table></div></div>`;
    case "flow": return html`<div className="stack">${b.label?html`<p className="lbl">${b.label}</p>`:null}<ol className="flow">${b.items.map(function(x,i){return html`<li key=${i}><span>${x}</span></li>`;})}</ol></div>`;
    case "callout": return html`<div className=${"call "+(b.kind||"key")}><b>${b.title||({key:"Key idea",bpo:"For BPO Wizard employees",warn:"Important",tip:"Tip"})[b.kind||"key"]}</b><p>${b.text}</p></div>`;
    case "listcards": return html`<div className="cards">${b.items.map(function(c){return html`<div className=${"card"+(c.tone==="warn"?" warn":"")} key=${c.title}><h4>${c.title}</h4><ul className="bul">${c.items.map(function(x,i){return html`<li key=${i}>${x}</li>`;})}</ul></div>`;})}</div>`;
    case "tabbed": return html`<${Tabbed} items=${b.items} label=${b.label}/>`;
    case "glossary": return html`<${Glossary}/>`;
    case "links": return html`<div className="chips">${b.items.map(function(x){return html`<a key=${x[1]} className="chip lnk" href=${x[1]} target="_blank" rel="noopener noreferrer">${x[0]}</a>`;})}</div>`;
    default: return null;
  }
}

function Point(p){
  var s=p.s, open=p.open;
  return html`<section className=${"pt"+(open?" open":"")} id=${"pt-"+s.id}>
    <button type="button" className="pt-h" aria-expanded=${open} onClick=${p.toggle}>
      <span className="pt-mark"></span><span className="pt-t">${s.title}</span><span className="pt-k">${s.kicker}</span><${Chev}/>
    </button>
    <${Collapse} open=${open}><div className="pt-body">${s.blocks.map(function(b,i){return html`<${Block} key=${i} b=${b}/>`;})}</div><//>
  </section>`;
}

function Waves(){
  var path="M0,60 C240,0 480,120 720,60 C960,0 1200,120 1440,60 C1680,0 1920,120 2160,60 C2400,0 2640,120 2880,60 L2880,120 L0,120 Z";
  function layer(fill,op,d,delay,rev){
    return html`<div className="wv" aria-hidden="true" style=${{"--d":d,animationDelay:delay,animationDirection:rev?"reverse":"normal",opacity:op}}>
      <svg viewBox="0 0 2880 120" preserveAspectRatio="none"><path d=${path} fill=${fill}/></svg></div>`;
  }
  return html`<div><div className="waves">${layer("#dcf3e7",1,"30s","-8s",false)}${layer("#16a870",0.55,"21s","-4s",true)}${layer("#0a7b50",1,"14s","-11s",false)}</div>
    <div className="wbase"><div className="wrap"><b>BPO Wizard</b><span>Database Training Document</span><span>Training Library / Phase 01</span></div></div></div>`;
}

function Footer(p){
  var prev=p.id>1?CH[p.id-2]:null, next=p.id<TOTAL?CH[p.id]:null;
  return html`<footer className="foot"><div className="wrap narrow"><div className="pager">
    <button type="button" className="pg" onClick=${function(){p.go(prev?prev.id:0);}}><small>${prev?"Previous chapter":"Back"}</small><b>${prev?prev.title:"Contents"}</b></button>
    <button type="button" className="pg next" onClick=${function(){p.go(next?next.id:0);}}><small>${next?"Next chapter":"Finished"}</small><b>${next?next.title:"Back to contents"}</b></button>
  </div></div><${Waves}/></footer>`;
}

function Chapter(p){
  var ch=p.ch;
  var st=useState(function(){var o={};o[ch.sections[0].id]=true;return o;}), open=st[0], setOpen=st[1];
  var allOpen=ch.sections.every(function(s){return open[s.id];});
  function setAll(v){var o={};ch.sections.forEach(function(s){o[s.id]=v;});setOpen(o);}
  function toggle(id){var o=Object.assign({},open);o[id]=!o[id];setOpen(o);}
  var num=(ch.id<10?"0":"")+ch.id;
  return html`<div className="page">
    <div className="wrap narrow">
      <div className="ch-h">
        <div className="eyebrow"><span className="dot"></span>Chapter ${num} / ${TOTAL}</div>
        <h2>${ch.title}</h2>
        ${ch.sub?html`<p className="lede" style=${{fontWeight:600}}>${ch.sub}</p>`:null}
        <p className="lede">${ch.lede}</p>
        ${ch.intro?html`<p className="intro">${ch.intro}</p>`:null}
      </div>
      <div className="ch-tools"><button type="button" className="hbtn" onClick=${function(){setAll(!allOpen);}}>${allOpen?"Collapse all":"Expand all"}</button><span>${ch.sections.length} points. Tap a box to open it.</span></div>
      <div className="pts">${ch.sections.map(function(s){return html`<${Point} key=${s.id} s=${s} open=${!!open[s.id]} toggle=${function(){toggle(s.id);}}/>`;})}</div>
      <div className=${"take"+(ch.long?" long":"")}><small>KEY TAKEAWAY</small><p>${ch.take}</p></div>
    </div>
    <${Footer} id=${ch.id} go=${p.go}/>
  </div>`;
}

function Home(p){
  return html`<div className="page">
    <div className="cover"><div className="wrap">
      <div className="eyebrow"><span className="dot"></span>Training Library / Phase 01</div>
      <h1><em>Database</em> Training Document</h1>
      <h2>Recruiting Database & ATS/CRM Playbook</h2>
      <p className="sub">The recruiting concept first. The recruiter workflow second. The technology that enables it third.</p>
      <div className="pillars">
        <div className="pillar"><small>01 / THE FOUNDATION</small><b>Structured records</b></div>
        <div className="pillar"><small>02 / THE PRACTICE</small><b>Connected workflows</b></div>
        <div className="pillar"><small>03 / THE ASSET</small><b>Talent relationships</b></div>
      </div>
      <div className="meta"><span>Project lead <b>Hasham</b></span><span>Team <b>Atif & Hani</b></span><span>${TOTAL} chapters</span><span>Practical field guide</span></div>
    </div></div>
    <div className="wrap">
      <div className="sec-h"><h3>Contents</h3><p>Read, reference, reuse. Start at the beginning or jump to the chapter you need.</p></div>
      <div className="toc">${CH.map(function(c){
        var n=(c.id<10?"0":"")+c.id;
        return html`<button type="button" key=${c.id} className="tcard" onClick=${function(){p.go(c.id);}}>
          <span className="tnum">${n}<i></i></span><span className="tt">${c.title}</span><span className="ts">${c.lede}</span><span className="tgo">Read chapter <span>→</span></span></button>`;
      })}</div>
      <div className="howto"><div><h3>How to use this playbook</h3><p>This playbook explains the recruiting concept first, the operational workflow second, and the technology that supports it third. It is designed for recruiters, candidate researchers, recruiting coordinators, and team members who maintain candidate databases or use an Applicant Tracking System (ATS), Recruiting Customer Relationship Management (CRM) system, or combined platform.</p><p>Follow organizational policies for candidate consent, data retention, outreach, security, access permissions, client submissions, and system changes. Vendor capabilities and applicable requirements may change; verify current details before implementation.</p></div><div className="core"><small>CORE PRINCIPLE</small><p>Recruiting concept first. Workflow second. Technology third.</p></div></div>
      <div className="intro-end"><b>A better database. A stronger recruiting practice.</b><span>A practical, recruiter-focused guide to building a trusted talent asset.</span></div>
    </div>
    <${Waves}/>
  </div>`;
}

function App(){
  function fromHash(){
    var m=/^#ch(\d+)$/.exec(window.location.hash||"");
    var n=m?parseInt(m[1],10):0;
    return n>=1&&n<=TOTAL?n:0;
  }
  var st=useState(fromHash), page=st[0], setPage=st[1];
  var bar=useRef(null);
  function go(n){
    setPage(n);
    try{window.location.hash=n?"ch"+n:"";}catch(e){}
    window.scrollTo(0,0);
  }
  useEffect(function(){
    function h(){setPage(fromHash());window.scrollTo(0,0);}
    window.addEventListener("hashchange",h);
    return function(){window.removeEventListener("hashchange",h);};
  },[]);
  useEffect(function(){
    function s(){
      var d=document.documentElement, max=d.scrollHeight-window.innerHeight;
      if(bar.current)bar.current.style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+"%";
    }
    s();
    window.addEventListener("scroll",s,{passive:true});
    window.addEventListener("resize",s);
    return function(){window.removeEventListener("scroll",s);window.removeEventListener("resize",s);};
  },[page]);
  return html`<div>
    <header className="hdr"><div className="wrap">
      <button type="button" className="logo" aria-label="BPO Wizard, back to contents" onClick=${function(){go(0);}}><img src=${LOGO} alt="BPO Wizard"/></button>
      <span className="hdr-t">${page?"Chapter "+page+" of "+TOTAL:"Database Training Document"}</span>
      <button type="button" className="hbtn" onClick=${function(){go(0);}}>Contents</button>
    </div><div className="prog" ref=${bar}></div></header>
    ${page===0?html`<${Home} key="home" go=${go}/>`:html`<${Chapter} key=${"c"+page} ch=${CH[page-1]} go=${go}/>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();
</script>
</body>
</html>
