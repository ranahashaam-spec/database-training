   {label:"Reach out",text:"The recruiter records the professional reason for contact, sends a relevant message, and logs the response."},
   {label:"Agree next step",text:"The candidate asks to reconnect in three months. The record is updated with the candidate’s stated timing and a follow-up task."},
   {label:"Respect the answer",text:"The database should not treat silence as interest or continue outreach after an opt-out."}])]),
 SEC("4h","Stage 6. Update: keep records current over time","Stage 6",[
  P("Candidate data decays: people change employers, titles, locations, contact details, skills, availability, and career priorities. A record that was accurate when first created may no longer be accurate. Updating means reviewing existing data against newer evidence and making controlled changes while preserving useful history."),
  UL(["A new job requirement prompts a recruiter to revisit an older candidate record.","A professional profile or employer website shows a possible new role, promotion, employer, or location.","An email verification, phone check, candidate response, or returned message indicates a field may be outdated.","The candidate provides a new résumé, corrects information, changes preferences, or asks for a later follow-up.","A system freshness rule or scheduled review flags a record that has not been checked recently.","A recruiter discovers a mismatch, duplicate, incorrect title, wrong company, invalid contact detail, or outdated status."],"What should trigger an update"),
  STAIRS(TX(["Open the existing record first; search by name, profile URL, professional email, and employer to avoid creating a second record.","Review the current professional profile and suitable professional sources. Use more than one identifier when names are common or details conflict.","Compare old and new values. Identify what changed, what remains valid, and what is still uncertain.","Update the relevant fields using the agreed format and taxonomy. Do not silently replace reliable information with a lower-confidence guess.","Record the source, date checked, and verification status for material changes. Preserve past employment and recruiting history as history.","Refresh the next review date or follow-up task and notify the record owner if the change affects an active process."])),
  TB(["Field","Old value","New evidence and action"],[
   ["Current title","Tax Manager","Professional profile now shows Senior Tax Manager; verify employer and effective or current status, then update."],
   ["Employer","ABC Manufacturing","Company biography indicates a move to XYZ Group; confirm the person match before changing."],
   ["Work email","Old company email","Verification fails or email bounces; mark invalid or unverified and seek an approved current source."],
   ["Candidate status","Nurturing","Candidate says not interested in this role but open to future roles; record the response and agreed next step."],
   ["Location","Chicago","New profile suggests Dallas; confirm before replacing, and preserve the prior location only if useful to recruiting history."]],"Examples of updates"),
  CALL("key","Freshness should be field-specific. A candidate’s degree may remain stable for years, while current employer, title, contact details, availability, and interest can change quickly. A single “last updated” date should not imply that every field was reverified.")]),
 SEC("4i","Stage 7. Reuse: turn previous research into future value","Stage 7",[
  P("Reuse is the practical reason to maintain a recruiting database. A well-managed record can support multiple roles over time, reduce repeat research, preserve institutional knowledge, and help recruiters respond faster. Reuse does not mean automatically sending every old record to a client or assuming the candidate remains interested or qualified."),
  UL(["Search previous applicants, sourced candidates, interviewees, silver medalists, and past placements before beginning a new external search.","Use taxonomy filters to find talent by job family, title, industry, skills, seniority, geography, credentials, and previous activity.","Review candidate history, feedback, stated preferences, prior reasons for declining, and any follow-up commitments.","Revalidate time-sensitive information and confirm present interest before presenting or advancing a candidate.","Match the person to the new requirement based on evidence and current criteria, not merely because they were suitable for a different role.","If no existing candidate fits, source new talent and add qualified new records to strengthen the future talent pool."],"How recruiters reuse database records"),
  EX("Silver-medalist reuse",[
   {label:"Finalist, not selected",text:"A candidate reached the final interview stage for a Senior Accountant role but was not selected because another candidate had more direct industry experience."},
   {label:"Six months later",text:"A similar role opens. The recruiter searches the prior interview history."},
   {label:"Check",text:"The recruiter checks whether the candidate’s experience and contact details are current and reviews the earlier feedback."},
   {label:"Contact if appropriate",text:"The previous process shortens the search, but the recruiter still evaluates fit for the new role."}]),
  TB(["Useful measure","What it tells the team"],[
   ["Percentage of roles with a database search before external sourcing","Whether recruiters consistently use existing knowledge first."],
   ["Candidates re-engaged from prior records","Whether historical records are contributing to current pipelines."],
   ["Time from new requirement to first qualified shortlist","Whether searchable, current records improve response speed."],
   ["Duplicate sourcing or duplicate outreach rate","Whether teams are checking shared records and coordinating ownership."],
   ["Conversion of re-engaged candidates","Whether reuse is producing meaningful engagement or hiring outcomes."]],"Measuring reuse")]),
 SEC("4j","Stage 8. Clean: maintain a reliable, usable database","Stage 8",[
  P("Cleaning is the ongoing process of identifying and correcting duplicate records, inaccurate values, inconsistent formats, stale contact details, incomplete fields, incorrect classifications, and records that should be restricted or removed under policy. Cleaning is not simply deleting old records: some old records contain valuable history, while some recent records are already wrong."),
  TB(["Issue","Example","Corrective action"],[
   ["Duplicate records","One person appears twice under a full name and a shortened name.","Compare profile URL, employer history, email, and other identifiers; merge or link only when identity is sufficiently confirmed."],
   ["Wrong person or mislinking","A profile URL or contact detail belongs to someone with the same name.","Remove the incorrect association, find the correct source, and record the correction."],
   ["Incorrect or outdated fields","Old employer, title, email, phone, or location remains marked current.","Verify, correct, or mark unknown or unverified; record the source and date."],
   ["Formatting inconsistency","Titles, states, dates, phone numbers, or company names use different formats.","Apply approved formatting and taxonomy rules while preserving source evidence when needed."],
   ["Missing required data","No source URL, owner, status, or key role field.","Fill the field from reliable evidence or explicitly mark unavailable; do not invent a value."],
   ["Conflicting information","Two sources show different current employers.","Review source reliability and dates; resolve with evidence or flag for manual review."],
   ["Wrong tags or status","A candidate is labeled active after declining all contact.","Correct the status and make sure outreach rules honor preferences."],
   ["Broken or unusable references","Profile URL is broken, redirected, or points to a different person.","Recheck the identity through a professional source; replace the URL only after confirming the person."],
   ["Stale or unnecessary records","Record has no recruiting purpose, is beyond retention policy, or is subject to a deletion request.","Follow the organization’s retention, privacy, and suppression procedures; do not retain indefinitely by default."]],"Common cleaning tasks"),
  STAIRS([
   {label:"Prevent",text:"Use required fields, standard picklists, source tracking, duplicate warnings, and controlled imports."},
   {label:"Detect",text:"Run duplicate checks, invalid-contact checks, missing-field reports, stale-record reports, and taxonomy exception reports."},
   {label:"Triage",text:"Prioritize errors affecting active roles, candidate identity, outreach accuracy, privacy restrictions, and client submissions."},
   {label:"Correct",text:"Edit, merge, link, restrict, or remove records according to defined permissions and evidence thresholds."},
   {label:"Audit",text:"Preserve appropriate change history and document high-impact corrections or merges."},
   {label:"Learn",text:"Identify recurring causes, such as rushed imports or skipped verification, and improve the workflow rather than repeatedly fixing the same errors."}]),
  CALL("warn","Do not merge records based only on a matching name. A false merge can combine two people’s employment history, contact details, or candidate interactions and may be more damaging than a duplicate. Where identity remains uncertain, flag the records for review.")]),
 SEC("4k","Duplicates and data maintenance","Practice",[
  P("Duplicates appear when two recruiters source the same person, when a sourced candidate later applies, when an import is not checked, or when a person uses more than one email address. They are one of the most common reasons a database loses trust."),
  UL(["Search by name, profile URL, professional email, and employer before adding anyone.","Compare more than one identifier: email addresses, phone numbers, profile URLs, employment history, and location.","Merge only confirmed duplicates, only with the required permission, and only through the platform’s approved merge function.","Preserve notes, source links, activity history, submissions, and communication records during the merge.","If the match is uncertain, flag the records for review rather than deleting either profile."],"How to handle a possible duplicate"),
  TB(["When","Maintenance task"],[
   ["Before adding a record","Search for an existing record using several identifiers."],
   ["When a record is opened for a role","Check that title, employer, and contact details are current; correct what you can verify."],
   ["On a regular schedule set by the team","Run duplicate, stale-record, missing-field, and taxonomy-exception reports and work through the highest-priority items."],
   ["After any import or integration change","Review a sample, check for new duplicates, and confirm field mapping."],
   ["When a candidate opts out or asks for removal","Apply the suppression or deletion procedure at once and confirm outreach workflows honor it."]],"An example maintenance rhythm. Adapt it to the client’s policy.")]),
 SEC("4l","One candidate through all eight stages","Example",[
  EX("A Senior Tax Manager from source to clean",[
   {label:"Source",text:"Find a Senior Tax Manager on a professional network and confirm relevant industry experience from a public professional biography."},
   {label:"Add",text:"Create or locate the candidate record in the central ATS/CRM and save the source URL."},
   {label:"Enrich",text:"Check current employer and title, add relevant skills and approved contact details, standardize fields, and verify identity against more than one attribute."},
   {label:"Classify",text:"Apply the tags below, set appropriate access labels, and make the record searchable and governed.",tags:["Tax","Senior Manager","Manufacturing","Passive Talent"]},
   {label:"Engage",text:"Send relevant outreach, record the response, and schedule an agreed follow-up."},
   {label:"Update",text:"Three months later, check the professional profile and update a confirmed promotion and candidate preference."},
   {label:"Reuse",text:"A new role opens; search the database, review history, and confirm interest and fit."},
   {label:"Clean",text:"Resolve a duplicate record and correct an old email discovered during review."}])]),
 SEC("4m","Practical quality checklist","Checklist",[
  CHK(["The record belongs to the correct individual; identity is not based on name alone.","A source URL or source description and capture or review date are recorded.","Current title and employer are distinguished from previous employment.","Contact information has a clear verification status and is appropriate for the recruiting purpose.","Required fields, standard titles, tags, and statuses follow the team taxonomy.","Recruiter notes are factual, job-related, concise, and understandable to colleagues.","Candidate history, outreach outcomes, preferences, and follow-up commitments are recorded where relevant.","Duplicates, conflicting fields, broken links, and invalid contact details are resolved or flagged.","Opt-out and other applicable restrictions are visible to permitted users and honored by outreach workflows.","Sensitive information is minimized, access-controlled, and handled under organizational policy.","The record can be found and reused by another recruiter without relying on the original researcher’s memory."])]),
 SEC("4n","Reference notes","Sources",[
  P("This chapter is a recruiter-focused operational framework. Specific features depend on product, subscription, configuration, and organizational policy. Examples of public product documentation consulted for sourcing and enrichment concepts:"),
  {t:"links",items:[["LinkedIn Recruiter overview","https://www.linkedin.com/help/recruiter/answer/a6895082"],["Finding candidates and building talent pools","https://www.linkedin.com/help/sales-navigator/answer/a412125/finding-job-candidates-through-recruiter?lang=en"],["Indeed: Smart Sourcing","https://www.indeed.com/help/employers/articles/360015979211?co=US&hl=en"],["SalesQL for recruiters","https://salesql.com/salesql-for-recruiters"],["NIST: identity resolution","https://pages.nist.gov/800-63-3-Implementation-Resources/63A/resolution/"],["UK Government: responsible AI in recruitment","https://www.gov.uk/data-ethics-guidance/responsible-ai-in-recruitment-guide"]]}])
 ]},

/* ============ 5 ============ */
{id:5,title:"Database quality",
 lede:"Accurate. Complete. Current. Searchable. Structured. Reusable.",
 take:"Accurate. Complete. Current. Searchable. Structured. Reusable. The aim is not merely to collect records, but to maintain information another recruiter can understand and reuse.",
 sections:[
 SEC("5a","Why data quality matters","Why",[
  P("Candidate research supports recruiting decisions. A profile linked to the wrong person, an outdated title, an invalid contact detail, or a confusion between current and past employment can waste time and damage candidate experience. A useful record is accurate, traceable, consistently formatted, and clear about uncertainty, not merely filled with data."),
  UL(["Inaccurate data can waste outreach and weaken matching and reporting.","A record linked to the wrong person damages candidate experience and the client’s confidence.","When a database is not trusted, recruiters stop searching it, and previous work stops being reused."]),
  FLOW(["Accurate","Complete","Current","Searchable","Structured","Reusable"],"Six standards for a trusted record"),
  CALL("key","The aim is not merely to collect records, but to maintain information another recruiter can understand and reuse.")]),
 SEC("5b","The six standards, with practical examples","Table",[
  TB(["Standard","What it means","Practical example","Warning sign"],[
   ["Accurate","Correct, verified, and free from material errors.","After a job change, the recruiter verifies the employer and title before any outreach.","A title copied from an old résumé is shown as current."],
   ["Complete","Contains the essential fields needed to evaluate and recruit.","Email, profile link, employer, skills, location, and résumé are stored, not only name and phone.","A record that holds only a name and a phone number."],
   ["Current","Reflects the latest professional situation.","Seniority and availability are updated after a promotion.","No last-verified date, or one that is years old."],
   ["Searchable","Discoverable through filters, keywords, tags, or Boolean terms.","A search for a Senior Java Developer in Karachi, Banking, 5+ years can find the relevant records.","Title, skills, and industry buried in free-text notes."],
   ["Structured","Uses defined fields and categories.","Titles follow the team’s standard list.","“Sr Tax Mgr,” “Senior Tax Manager,” and “Sr. Tax Manager” stored as three different values."],
   ["Reusable","Supports future hiring.","Useful feedback and the job-related reason for non-selection are retained.","Notes that only the original recruiter can understand."]])]),
 SEC("5c","What quality looks like in practice","Checklist",[
  CHK(["After a job change, verify employer and title.","Store email, profile, employer, skills, location, and résumé, not only name and phone.","Update seniority and availability after a promotion.","Ensure a Senior Java Developer search in Karachi, Banking, 5+ years can find relevant records.","Keep title, skills, and industry in fields rather than buried in notes.","Retain useful feedback for future roles."])]),
 SEC("5d","Evidence and source quality","Sources",[
  P("Not every source deserves the same trust. Match the evidence to the claim, and check its date."),
  TB(["Evidence type","Typical use","Caution"],[
   ["Candidate-provided résumé or direct confirmation","Experience, preferences, availability, and corrections.","Check context and date; résumés may omit recent changes."],
   ["Official employer or leadership page","Current title, employer, organizational responsibility.","Pages may be stale; confirm identity and timing."],
   ["Professional profile maintained by the person","Career history, skills, current role, and public professional details.","Check freshness and separate current from past roles."],
   ["Professional association, credential, or publication","Credentials, licenses, specialization, and published work.","Confirm that the evidence belongs to the same person."],
   ["Third-party enrichment tool","Discovery and professional contact research.","Coverage and freshness vary; verify important fields."],
   ["Search snippet or uncorroborated directory","A lead for additional research.","Not conclusive evidence for material changes."]])]),
 SEC("5e","Research and verification workflow","Process",[
  STAIRS(TX(["Resolve identity using name, employer, location, profile URL, career history, and another identifier where possible.","Confirm the current role and distinguish current employment from previous roles.","Compare relevant experience with the actual job criteria, including function, industry, scope, seniority, and credentials.","Verify contact details using approved tools and label work, personal, direct, mobile, and main-office numbers correctly.","Record the source URL, the date checked, and the verification status where required.","Mark missing or uncertain data clearly; do not fill gaps with guesses.","Review conflicting evidence and escalate unresolved identity or data issues."]))]),
 SEC("5f","Field standards","Table",[
  TB(["Field","Standard practice"],[
   ["Name","Use the person’s professional name; do not invent expansions."],
   ["Title and employer","Separate current employment from past roles; verify the effective or current status."],
   ["Dates","Use consistent formats; do not invent missing months or years."],
   ["Email and phone","Use agreed formats and label the contact type; distinguish invalid from unverified."],
   ["Location","Separate candidate location from company headquarters or branch location."],
   ["Skills and credentials","Capture job-related evidence; do not infer a certification from a title."],
   ["Notes","Use factual, professional, job-related notes; avoid speculation or irrelevant personal commentary."],
   ["Source and status","Keep source, review date, verification state, and owner where required."]])]),
 SEC("5g","Common research errors","8 errors",[
  CARDS([
   {title:"Identity and mislinking",text:"Attaching another person’s details to a similar name."},
   {title:"Overlapping records",text:"Creating a second profile instead of updating an existing one."},
   {title:"Data swapping",text:"Placing a title, phone, employer, or email into the wrong field or person record."},
   {title:"Tool skipped",text:"Missing an approved validation or source-check step."},
   {title:"Incomplete research",text:"Leaving required fields unchecked without a clear status."},
   {title:"Process not followed",text:"Ignoring naming, tagging, documentation, or approval standards."},
   {title:"Bad email or bad number",text:"Treating an invalid or unverified value as confirmed."},
   {title:"Formatting issues",text:"Inconsistent titles, capitalization, dates, phone numbers, or tags."}])]),
 SEC("5h","Quality-control checklist","Checklist",[
  CHK(["Is this definitely the correct person?","Is the title current and the employer correctly identified?","Does the experience support the job criteria?","Are contact fields correctly labeled and formatted?","Are sources and verification dates recorded where required?","Have duplicates and conflicting information been checked?","Are notes factual, relevant, and professional?"])]),
 SEC("5i","Handling personal data responsibly","Governance",[
  P("Recruiting records contain personal and professional information. Collect and use information appropriate to the recruiting purpose, follow applicable law and company policy, respect communication preferences, and restrict access to people who need it for their work."),
  UL(["Use approved tools, accounts, and data sources; do not bypass access restrictions.","Follow retention schedules and deletion requirements.","Record candidate opt-outs and communication restrictions accurately.","Limit sensitive or irrelevant personal information in notes.","Share candidate data only through approved channels and with authorized recipients.","Apply access controls to confidential searches, client-specific data, and restricted records.","Escalate suspected data exposure, incorrect access, or privacy concerns through the approved process."]),
  CALL("bpo","Follow the client’s policies for candidate consent, data retention, outreach, security, access permissions, and system changes. If a rule is unclear, ask before you add, change, or share anything.")]),
 SEC("5j","Measuring quality and use","Measures",[
  TB(["Measure","What it assesses","Caution"],[
   ["Time to first qualified shortlist","Speed to usable candidate options.","Define “qualified” consistently."],
   ["Database-first search rate","Whether existing talent is checked before external sourcing.","A search alone does not prove fit."],
   ["Profile completeness and verification","Whether required fields and evidence standards are met.","Do not reward filling fields with guesses."],
   ["Duplicate rate","Frequency of multiple records for one person.","Review identity rules and imports."],
   ["Contact validity rate","Whether contact details are usable and checked.","Separate invalid, unverified, and unavailable."],
   ["Response and engagement rate","Whether outreach reaches relevant candidates.","Consider targeting, timing, channel, and consent."],
   ["Candidate conversion by stage","Where candidates progress or exit.","Segment by role and source."],
   ["Re-engagement outcomes","Whether historical relationships help fill new roles.","Prioritize relevance, not raw volume."]])])
 ]},

/* ============ 6 ============ */
{id:6,title:"Searchability & taxonomy",
 lede:"How recruiters find people, and why standardized titles and categories matter.",
 take:"Recruiters find people by combining title, industry, location, skills, experience, company, seniority, certifications, status, and previous activity. A shared taxonomy means one search finds everyone relevant, even when their titles differ.",
 sections:[
 SEC("6a","How recruiters search","Criteria",[
  P("Recruiters rarely search for just one thing. They combine several criteria so that the shortlist is both relevant and manageable."),
  CHIPS(["Current or previous title","Industry","City or region","Remote and relocation preferences","Skills","Experience","Target company","Seniority","Certifications","Candidate status","Previous activity"],"Search by"),
  CHIPS(["Financial Analyst","Python","Power BI","SAP","React","PMP","ACCA","CPA","CFA","AWS","SHRM"],"Examples of searchable terms")]),
 SEC("6b","Translate the job into a search brief","Preparation",[
  P("Before searching, convert the request into a clear search brief. Separate essential requirements from preferences so that the search remains focused without excluding strong candidates unnecessarily."),
  TB(["Criteria","Examples","Use"],[
   ["Essential","Required license, core function, mandatory experience, required location.","Apply as hard filters only when genuinely mandatory."],
   ["Strong preference","Specific industry, company scale, systems, leadership experience.","Use to prioritize and compare candidates."],
   ["Transferable evidence","Comparable projects, adjacent industries, related titles.","Review manually instead of relying on exact keywords only."],
   ["Exclusions","Experience types or locations clearly outside scope.","Apply only when supported by the role brief."]])]),
 SEC("6c","Taxonomy: standardized titles and categories","Concept",[
  P("A taxonomy is a shared classification structure for titles, skills, industries, and categories. Approved categories help recruiters find relevant people even when titles differ."),
  EX("Three titles, one category",TX(["HR Generalist, Human Resources Officer, and HR Executive can be grouped under Human Resources with approved sub-titles.","A search for the category finds all three, instead of three separate searches that each miss part of the group."]),
   {viz:{type:"group",parent:"Human Resources",kids:["HR Generalist","Human Resources Officer","HR Executive"]}}),
  UL(["Matching: one search finds every variant of a title.","Duplicate review: standard values make repeated records easier to spot.","Reporting: counts by category are meaningful when categories are consistent.","Scalable management: every recruiter follows the same rules, so the database stays usable as it grows."],"Why standardized titles and categories matter"),
  CALL("key","Do not classify the same role as “Sr Tax Mgr,” “Senior Tax Manager,” and “Sr. Tax Manager” in three separate categories if the database can map them to one standard value. Keep the original wording in a source or history field when it is useful.","Standardization rule")]),
 SEC("6d","Boolean search basics","Reference",[
  TB(["Syntax","Purpose","Example"],[
   ["AND","Requires both concepts.","Tax AND Director"],
   ["OR","Allows alternatives.","“Project Manager” OR “Program Manager”"],
   ["NOT","Excludes a term where supported.","Recruiter NOT intern"],
   ["Quotation marks","Searches an exact phrase on many platforms.","“Head of Tax”"],
   ["Parentheses","Groups alternatives.","(“Project Manager” OR “Program Manager”) AND construction"],
   ["Title variants","Captures different naming conventions.","“Tax Director” OR “VP Tax” OR “Head of Tax”"]]),
  CALL("warn","Boolean syntax varies by platform. Test the query, review the result set, and adapt it to the search engine’s documented behavior.","Check before you rely on it"),
  NOTE("To be added by the team: approved Boolean syntax and platform-specific search examples.")]),
 SEC("6e","Build a search in layers","Process",[
  STAIRS(TX(["Start with the function and core title variants.","Add essential skills, specialization, credentials, or industry terms.","Apply geography, seniority, employer, and other relevant filters.","Review a sample to see whether the search is too broad or too narrow.","Add exclusions only when the unwanted result pattern is clear.","Save the query or document the criteria if the search needs to be repeated."]))]),
 SEC("6f","Practical search example: Senior Java Developer","Example",[
  CHIPS(["Senior Java Developer","Karachi","Banking experience","5+ years"],"Requirement"),
  EX("How the search runs",[
   {label:"Filter",text:"Combine structured title, location, industry, skills, and experience filters."},
   {label:"Add a Boolean layer",text:"For example: (“Java Developer” OR “Java Engineer” OR “Backend Developer”) AND (bank OR banking OR fintech) AND Karachi. This is an illustration to adapt, not a team-approved query."},
   {label:"Review",text:"Review previous activity and notes."},
   {label:"Verify",text:"Verify current fit and availability before outreach."}])]),
 SEC("6g","Candidate matching framework","Table",[
  TB(["Dimension","Questions"],[
   ["Identity and current role","Is it the right person? Is the current employer and title confirmed?"],
   ["Relevant experience","Has the person performed comparable responsibilities at the required level?"],
   ["Industry and environment","Does the person understand the relevant sector or operating model?"],
   ["Skills and credentials","Is there evidence for required technical skills, licenses, or certifications?"],
   ["Seniority and scope","Do decision authority, complexity, and leadership responsibilities match?"],
   ["Location and logistics","Does geography or work arrangement meet the role’s actual requirements?"],
   ["Career context","Is the history coherent, with uncertainties handled fairly?"],
   ["Interest and availability","Has current interest or availability been confirmed where needed?"],
   ["Data quality","Are notes, contact details, source, and status reliable enough to act on?"]])]),
 SEC("6h","Shortlisting and ranking","Judgment",[
  P("Apply the criteria consistently. Check essential requirements first, then compare candidates using relevant evidence. A scoring matrix may support consistency, but criteria should be transparent and job-related."),
  CALL("warn","A keyword score or AI recommendation must not replace verification or professional judgment.")]),
 SEC("6i","When search results are weak","Troubleshooting",[
  UL(["Check title variations used in the industry or region.","Use related responsibilities and skill synonyms instead of exact keywords only.","Review geography and seniority filters for unnecessary restrictions.","Check whether the target experience sits under another function or company naming convention.","Discuss the role brief before broadening essential criteria.","Document query changes so the process remains explainable and repeatable."])])
 ]},

/* ============ 7 ============ */
{id:7,title:"Database + sourcing",
 lede:"Every sourcing activity can become part of a long-term talent asset, even when the candidate is not right for today’s role.",
 take:"Every relevant search can become a long-term talent asset. Capture today, reuse tomorrow, and understand the industry and organization behind the title.",
 sections:[
 SEC("7a","Capture today. Reuse tomorrow.","Principle",[
  P("Sourcing takes time. If the only result is one shortlist for one role, most of that effort disappears when the role closes. If each relevant person is captured properly, the effort keeps its value."),
  CHK(["Capture relevant candidates even when not selected.","Record job-related reasons for non-selection such as experience, compensation, location, or specialization.","Add forward-looking tags.","Maintain relevant engagement and update records as people gain experience or move.","Search internally before new external sourcing."])]),
 SEC("7b","Worked example: Java developer","Example",[
  EX("A near miss that pays off later",[
   {label:"The gap",text:"A Senior Java Developer lacks the required cloud experience."},
   {label:"Keep the profile",text:"Keep the profile with forward-looking tags.",tags:["Java","Backend Developer","Future Cloud Role","Karachi"]},
   {label:"Six months later",text:"A Java role with a lower cloud requirement opens."},
   {label:"Reuse",text:"The record can be reviewed and reused."}])]),
 SEC("7c","Long-term value by source","6 sources",[
  CARDS([
   {title:"Job boards",text:"Can create searchable records for similar roles."},
   {title:"Professional networks",text:"Can build active and passive pools."},
   {title:"Referrals",text:"Can support future requirements."},
   {title:"Career fairs",text:"Can build early-career pipelines."},
   {title:"Talent communities",text:"Maintain relationships."},
   {title:"Rejected-candidate follow-up",text:"Gives closure while preserving strong future talent."}])]),
 SEC("7d","Search first, then source","Workflow",[
  FLOW(["Search the database","Review what exists","Source externally for gaps","Add new qualified people","Tag for future roles"]),
  UL(["Check the database before external sourcing, so existing talent is reviewed first.","Add only people who are relevant and appropriately sourced.","Search for an existing record before creating a new one, to avoid duplicates.","Check who already owns the relationship, to avoid duplicate outreach.","Record where each person came from, so the source can be reviewed later."])]),
 SEC("7e","What every search should leave behind","Checklist",[
  UL(["The search criteria and the date, so the search can be repeated.","The source URL or source description for every person added.","The job-related reason a person is not right for today’s role.","Forward-looking tags that describe where they might fit.","An owner and a next step, if there is one."]),
  NOTE("Record only information that is relevant, appropriately obtained, and permitted by the organization’s policies and the source’s terms.")]),
 SEC("7f","Industry understanding and role context","Research",[
  P("Good recruiting research requires understanding the industry and the organization, not just finding someone with a matching title. Similar titles can mean different things across sectors, and the same organization may have different business units, locations, reporting structures, and leadership responsibilities."),
  UL(["Industry: identify the employer’s actual business model and sector, not only a broad label.","Function: establish the work being performed, such as tax, finance, legal, engineering, sales, or operations.","Seniority: assess scope, decision authority, complexity, team size, and reporting level, not title alone.","Specialization: identify the technical sub-discipline relevant to the role.","Environment: distinguish corporate or in-house experience from public accounting, consulting, advisory, law firm, agency, or vendor-side experience when the requirement calls for it.","Scale and complexity: consider company size, geographic reach, regulatory environment, and operational scope when relevant."],"Understand the role context")]),
 SEC("7g","Account analysis framework","Table",[
  TB(["Area","Questions","Research output"],[
   ["Business model","What does the company do and who does it serve?","Industry and business-model classification."],
   ["Company structure","Is it a parent, subsidiary, division, or standalone organization?","Correct account relationship."],
   ["Locations","Where are headquarters, branches, and operating sites?","Accurate geography and location context."],
   ["Leadership","Who leads the function and who do they report to?","Verified organizational hierarchy."],
   ["Function scope","Is the work in-house, client-facing, advisory, operational, or regional?","Relevant experience criteria."],
   ["Hiring context","Is there a vacancy, expansion, or other signal worth validating?","Research hypothesis, not an assumption."],
   ["Source quality","Which official or credible sources support the information?","Evidence links and confidence level."]])]),
 SEC("7h","Understand professional hierarchies","Research",[
  UL(["Separate the leader of a function from the executive above that function.","Distinguish a department head from a regional lead, business-unit leader, or specialist manager.","Check whether a title is company-wide, regional, divisional, or limited to one business unit.","Use official leadership pages, professional biographies, filings, and other credible sources to corroborate reporting lines where available.","Record ambiguity explicitly rather than forcing a person into a hierarchy level without evidence."])]),
 SEC("7i","Example: in-house tax leadership","Example",[
  P("If a search requires a corporate Head of Tax, determine whether a person leads the tax function inside an operating company or works at an accounting, consulting, advisory, or law firm."),
  CALL("key","If the requirement is explicitly in-house, an external tax partner may have strong technical expertise but still fall outside the target profile. Verify the actual tax leader, the company structure, and the reporting relationship rather than relying on title alone.","What to take from this")]),
 SEC("7j","Why account analysis improves results","Value",[
  UL(["Reduces false-positive matches caused by title ambiguity.","Distinguishes in-house, advisory, consulting, and vendor-side experience.","Improves seniority and reporting-line mapping.","Makes employer and location matching more reliable.","Helps explain why a candidate fits or does not fit a requirement.","Creates a repeatable method another researcher can review."])])
 ]},

/* ============ 8 ============ */
{id:8,title:"Database + candidate relationships",
 lede:"Store the relationship, not just the record.",
 take:"Store the relationship, not just the record. Candidate history, follow-ups, segmentation, and respectful re-engagement are what turn a list of people into a talent asset.",
 sections:[
 SEC("8a","History that survives handovers","Records",[
  P("Keep roles, applications, interviews, conversations, and outcomes together, so the relationship does not depend on one recruiter’s memory."),
  CHIPS(["Date","Channel","Role or talent pool","Response","Agreed next action","Follow-up date","Preferences","Availability","Job-related reason for non-selection"],"Record each time"),
  NOTE("Notes should be concise, factual, and understandable to another recruiter.")]),
 SEC("8b","Segmentation and nurturing","5 groups",[
  P("Not every person should hear from you in the same way or at the same time. Segmenting the database lets each group receive what is relevant to it."),
  CARDS([
   {title:"Active candidates",text:"Need prompt, role-specific updates."},
   {title:"Passive talent",text:"Benefits from occasional relevant touchpoints."},
   {title:"Silver medalists",text:"Can be reconsidered for similar roles."},
   {title:"Industry and function pools",text:"Can receive relevant openings or market information."},
   {title:"Do Not Contact",tone:"warn",text:"Means no outreach. Keep the flag visible to permitted users."}])]),
 SEC("8c","Follow-ups and nurturing in practice","Practice",[
  UL(["Active candidates need prompt updates. Do not leave them waiting for news.","Passive talent benefits from occasional, relevant touchpoints, such as a suitable opening or useful market information, not constant messages.","When a candidate asks to reconnect later, record the stated timing and set a follow-up for then.","Check the Do Not Contact flag and communication preferences before every outreach.","After every interaction, update the status, notes, and next action while the detail is fresh.","Hand over with context, so another recruiter can continue the relationship without starting again.","Close the loop with candidates who are not selected. A courteous answer keeps the relationship and preserves strong future talent."]),
  CALL("warn","Automation should support timely, relevant communication, not send messages without regard to candidate preference or context. See the engagement automation table in Chapter 4.")]),
 SEC("8d","Re-engagement example: a silver medalist","Example",[
  EX("A Senior Accountant finalist",[
   {label:"Not chosen",text:"A Senior Accountant finalist was not chosen because another candidate had more direct industry experience."},
   {label:"Six months later",text:"Search interview history for a similar opening."},
   {label:"Check",text:"Check current details, review feedback, and contact the candidate if appropriate."},
   {label:"Reassess",text:"Reassess skills, interest, and availability. Do not assume the earlier result still applies."},
   {label:"Respect the answer",text:"Silence is not interest. Stop after an opt-out."}])]),
 SEC("8e","Maintaining long-term relationships","Principles",[
  UL(["Treat every interaction as part of a longer relationship, not a one-time transaction.","Keep preferences, availability, and interests on the record, so outreach is relevant.","Update the relationship status as it changes: Contacted, Engaged, Interested, Nurtured, Re-engaged.","Keep notes factual and job-related, so they can be shared safely with colleagues.","Respect opt-outs and retention rules. A relationship the candidate has ended is not a relationship to keep working.","Review the record before every contact, so the message reflects what is already known."])])
 ]},

/* ============ 9 ============ */
{id:9,title:"Major ATS/CRM platforms",
 lede:"Understand the recruiting problem each platform solves, not just its feature list.",
 take:"Understand the recruiting problem, not just the feature list. The database is an operational asset, ATS and CRM solve different but connected problems, AI depends on data quality, and integrations need governance. Recruiting concept first. Workflow second. Technology third.",
 long:true,
 sections:[
 SEC("9a","Three overlapping categories","Concept",[
  P("Recruiting databases and platforms support the modern recruiting lifecycle. They help recruiters identify candidates, maintain professional relationships, manage vacancies, track recruitment activities, and turn talent information into successful placements. The goal is to understand the recruitment problem each platform solves, not simply to memorize product features."),
  CARDS([
   {title:"ATS",text:"Manages the recruitment process from job requisition and application through screening, interviews, selection, and hiring. Core question: where is each candidate in the hiring process?"},
   {title:"Recruiting CRM",text:"Maintains long-term relationships with candidates, clients, hiring managers, and prospects, including people who are not currently applying. Core question: who should we build a relationship with for current or future opportunities?"},
   {title:"Talent intelligence and sourcing",text:"Helps recruiters discover, enrich, segment, and analyze talent pools using external data, automation, and AI. Core question: where can we find the right people, and who is most relevant?"}]),
  NOTE("Many modern platforms combine two or all three categories. These classifications are useful starting points, not always strict boundaries.")]),
 SEC("9b","The 13 platforms at a glance","Table",[
  TB(["Platform","Category","Typical users","Main differentiator"],[
   ["Workday Recruiting","ATS + enterprise HCM","Large organizations","Recruitment connected to HR and workforce management"],
   ["Greenhouse","ATS","Growing and large employers","Structured, consistent hiring"],
   ["iCIMS","ATS + talent acquisition suite","Mid-market and enterprise","Broad talent acquisition capabilities"],
   ["SmartRecruiters","ATS + talent acquisition platform (now part of SAP)","Mid-market and enterprise","Connected hiring workflows and ecosystem"],
   ["Ashby","ATS + analytics + CRM capabilities","Technology companies and scaling teams","Recruiting analytics and integrated workflows"],
   ["Lever","ATS + CRM (offered by Employ)","Growing and enterprise employers","Candidate pipeline and relationship management"],
   ["Bullhorn","ATS + staffing CRM","Staffing and recruiting agencies","Candidate, client, job, and placement management"],
   ["Crelate","ATS + CRM","Recruiting and executive search firms","Flexible agency recruiting workflows"],
   ["Loxo","ATS + CRM + sourcing","Recruiting and executive search agencies","Talent discovery and recruiting in one system"],
   ["Avature","Configurable enterprise ATS + CRM","Global enterprises","Highly configurable talent acquisition workflows"],
   ["Gem","ATS + CRM + sourcing + analytics","Corporate talent acquisition teams and recruiting firms","Nurturing, sourcing, and funnel insights in one platform"],
   ["Beamery","Talent CRM + talent intelligence","Large enterprises","Talent pools, skills intelligence, and workforce planning"],
   ["Recruit CRM","ATS + CRM","Recruitment agencies","Agency operations, candidate tracking, and client management"]]),
  NOTE("These are high-level classifications. Exact functionality depends on product edition, modules, integrations, and contract.")]),
 SEC("9c","Explore each platform","13 profiles",[
  P("Filter by group, then tap a platform for its profile: what it is, who uses it, whether it is an ATS, a CRM, or both, the recruiting problem it solves, and its key database and relationship capabilities."),
  {t:"platforms"}]),
 SEC("9d","What has changed recently","Checked Nov 2026",[
  P("Recruiting technology changes quickly. These changes affect how some platforms are described in older comparisons."),
  CARDS([
   {title:"SmartRecruiters joined SAP",text:"SAP announced on 11 September 2025 that it had completed the acquisition. SAP plans to integrate SmartRecruiters with SAP SuccessFactors, and says customers can keep using it with SAP or other HCM providers."},
   {title:"Workday added AI agents",text:"Workday describes a Recruiting Agent (from HiredScore) for sourcing, screening, and matching, and a Candidate Experience Agent (from Paradox) for candidate questions and scheduling."},
   {title:"Gem became all-in-one",text:"Gem began as a recruiting CRM and sourcing tool. It now describes itself as an AI-first all-in-one platform that combines ATS, CRM, sourcing, scheduling, and analytics."},
   {title:"Lever is offered by Employ",text:"Employ presents Lever alongside JazzHR and Jobvite. Lever combines ATS and candidate relationship management."},
   {title:"Agency platforms added AI",text:"Bullhorn (Amplify and Search & Match), Crelate (Discover Agent, Insights Agent, Co-Pilot), Loxo (AI agents and natural-language search), and Recruit CRM (AI sourcing and an MCP connection) each describe AI features. Availability varies by plan."},
   {title:"iCIMS kept expanding",text:"iCIMS announced its Summer 2026 release on 9 July 2026, adding High Volume Hiring and enhanced candidate search across its ATS and CXM."}]),
  NOTE("These points come from vendor announcements and websites and describe vendor positioning, not independent rankings.")]),
 SEC("9e","What makes the platforms different","Table",[
  TB(["Platform","Strongest reason to consider it","Best-fit scenario"],[
   ["Workday","Unified HR and recruiting ecosystem","Large enterprise with complex HR operations"],
   ["Greenhouse","Structured hiring and consistent evaluations","Corporate team improving interview quality"],
   ["iCIMS","Broad talent acquisition and engagement","Employer hiring across many roles and locations"],
   ["SmartRecruiters","Connected hiring workflows","Organization with multiple hiring stakeholders"],
   ["Ashby","Recruiting analytics and integrated operations","Team optimizing hiring funnel performance"],
   ["Lever","ATS and candidate CRM together","Employer building long-term candidate pipelines"],
   ["Bullhorn","Staffing agency operations and placements","Agency managing client jobs and candidate placements"],
   ["Crelate","Flexible agency recruiting workflows","Boutique search or staffing firm"],
   ["Loxo","Sourcing and recruitment in one workflow","Recruiter focused on passive talent"],
   ["Avature","Deep workflow configurability","Global enterprise with specialized hiring processes"],
   ["Gem","Candidate engagement, sourcing, and analytics in one platform","Corporate team nurturing passive candidates"],
   ["Beamery","Skills intelligence and strategic talent pools","Enterprise planning future talent requirements"],
   ["Recruit CRM","Agency ATS/CRM with automation","Recruitment agency seeking a consolidated platform"]]),
  NOTE("These are practical distinctions based on vendor positioning, not an independent performance ranking.")]),
 SEC("9f","How AI works inside ATS and CRM platforms","AI",[
  CARDS([
   {title:"AI sourcing and talent discovery",text:"Identify candidates using job titles, skills, employment history, industry experience, location, and other relevant criteria."},
   {title:"Résumé parsing and profile enrichment",text:"Extract names, employers, job titles, dates, qualifications, and skills from résumés. Separate enrichment tools may add professional information."},
   {title:"Candidate matching and prioritization",text:"Compare candidate attributes with job requirements using keyword search, structured filters, skills taxonomies, machine learning, or semantic search."},
   {title:"Communication and relationship management",text:"Draft outreach, summarize conversations, suggest follow-ups, support engagement campaigns, and assist with scheduling."},
   {title:"Analytics and recruitment intelligence",text:"Identify pipeline bottlenecks, compare sourcing channels, summarize activity, and monitor hiring performance."}]),
  CALL("warn","These are examples of vendor capabilities and potential applications, not a guarantee that every platform provides every feature in its standard subscription. Verify current vendor documentation before describing a feature as included.","Capabilities are not guarantees"),
  UL(["Treat AI-generated summaries, matches, and contact details as suggestions requiring review.","Check whether the source supports each material claim.","Do not enter confidential candidate or client information into unapproved AI tools.","Review generated outreach for accuracy, relevance, tone, and privacy.","Monitor for biased or irrelevant matching signals and use job-related criteria.","Keep human accountability for shortlisting, submission, and hiring decisions.","Confirm licensing, permissions, and vendor terms before connecting AI to ATS/CRM data."],"AI and automation controls")]),
 SEC("9g","How to integrate external tools and applications","5 methods",[
  CARDS([
   {title:"Native integration",text:"A ready-made connector provided by the ATS/CRM vendor or a technology partner; often the simplest option."},
   {title:"API integration",text:"Applications exchange information through documented application programming interfaces, enabling customized data flows."},
   {title:"Webhooks and event-driven automation",text:"An application sends a notification when an event occurs, such as a candidate being created or moved to another stage."},
   {title:"Middleware and automation platforms",text:"Services such as Zapier or other automation tools connect applications, subject to connector availability."},
   {title:"AI connectors and agent protocols",text:"Supported connectors or protocols such as MCP can allow AI assistants to access permitted information or perform approved actions."}]),
  NOTE("Before implementing an integration, confirm the official connector, API documentation, licensing, permissions, field mappings, data retention rules, and support boundaries.")]),
 SEC("9h","Example: research connected to an ATS","Example",[
  EX("From sourcing to a controlled record",[
   {label:"1. Candidate sourcing",text:"LinkedIn, job boards, the internal database, or approved sourcing tools."},
   {label:"2. AI-assisted research",text:"Extract profile details, summarize experience, compare requirements, and flag missing fields."},
   {label:"3. Verification",text:"Check source accuracy, employment history, contact data, and potential duplicate records."},
   {label:"4. ATS/CRM record update",text:"Create or update the candidate record and preserve source links, verification status, and notes."},
   {label:"5. Recruitment workflow",text:"Assign the candidate to a suitable job, schedule follow-ups, and track outcomes."}]),
  CALL("key","AI prepares and assists; the ATS/CRM retains the controlled recruitment record. Automatic updates should be limited to fields the integration is authorized to change.","Principle")]),
 SEC("9i","Integration reference: tool categories and data flows","Table",[
  TB(["External tool category","Purpose","Information that may flow into the ATS/CRM"],[
   ["LinkedIn and sourcing platforms","Discover candidates","Profile URL, source, relevant professional details"],
   ["ZoomInfo and contact-data tools","Research professional contacts","Business contact details and company information, subject to validation"],
   ["Email verification services","Validate email addresses","Verification status, check date, result"],
   ["AI assistants","Research, summarize, classify","Proposed summaries, skills, missing fields, research notes"],
   ["Calendars and scheduling","Coordinate interviews","Interview dates, availability, status"],
   ["Assessment and screening tools","Evaluate job-related criteria","Assessment results and screening status"],
   ["Reporting tools","Analyze recruitment performance","Funnel metrics, time to fill, source performance"]]),
  NOTE("Not every application supports every data flow. Check the connector, API documentation, licensing, and permissions. Minimize personal data transfer and require appropriate human review for consequential candidate decisions.")]),
 SEC("9j","Final learning points for recruiters","Summary",[
  CHK(["The database is an operational asset. Accurate candidate, company, and contact records support better sourcing, faster shortlisting, and continuity across projects.","ATS and CRM solve different problems. An ATS manages active hiring processes; a CRM supports long-term relationships and talent pipelines. Many platforms combine both.","AI depends on data quality. Incorrect titles, duplicate records, incomplete employment histories, and poor source data can lead to unreliable matches.","Integrations require governance. Data synchronization, access permissions, duplicate management, and validation rules are essential to a reliable recruitment database.","Choose for the recruitment business model. Corporate talent acquisition, staffing agencies, executive search, and strategic workforce planning have different requirements."]),
  CHIPS(["Recruiting concept first.","Workflow second.","Technology third."],"Core principle")]),
 SEC("9k","Research and accuracy note","Note",[
  CALL("warn","This is a high-level training reference, not a procurement recommendation or a technical implementation specification. Vendor capabilities, product names, AI features, APIs, integrations, and plan limits change over time. Platform details here were checked against vendor websites and announcements in November 2026. Before selecting or implementing a platform, confirm details with the official vendor documentation, current product plan, security terms, and integration requirements.","Verify before you rely on it"),

{id:10,title:"BPO Wizard’s tools",
 lede:"How the concepts in this playbook connect to Crelate, Bullhorn, and Loxo, and the recruiting purpose behind each.",
 take:"Learn the recruiting purpose first. In any client tool, search before you add, confirm identity, record the source, follow the client’s taxonomy, keep notes factual, and respect candidate preferences. The software changes; the standard does not.",
 sections:[
 SEC("10a","Purpose before software","Introduction",[
  P("Recruiting concept first. Workflow second. Technology third. This chapter connects the concepts in this playbook to the three platforms BPO Wizard teams work in: Crelate, Bullhorn, and Loxo. It explains the recruiting purpose behind each tool. It is not a step-by-step software manual; use the client’s own procedures and training for button-level instructions."),
  P("All three are described by their vendors as combining ATS and CRM functions for recruiting and staffing firms. Crelate and Loxo also describe in-house recruiting teams among their users. In each one, the database is the shared record of candidates, contacts, companies, jobs, and the history that connects them."),
  CALL("bpo","In a client’s database, every record you add or update becomes part of the client’s recruiting asset. Ask what the client will do with the record, then make it accurate, searchable, and reusable.")]),
 SEC("10b","Three tools at a glance","Table",[
  TB(["Tool","Category","Typical users","The recruiting purpose it serves"],[
   ["Crelate","ATS + CRM","Boutique agencies, executive search firms, staffing firms, and in-house teams","One shared record for talent, clients, and business development, so candidate relationships and client work stay connected."],
   ["Bullhorn","ATS + staffing CRM","Staffing and recruiting agencies","Manage the client who needs talent and the candidate who may fill the vacancy: job orders, submissions, and placements."],
   ["Loxo","ATS + CRM + sourcing","Recruiting and executive search firms, and in-house teams","Bring talent discovery, outreach, and pipelines into one workflow, so sourcing leads become managed records."]])]),
 SEC("10c","Tool by tool","Tap a tool",[
  {t:"tabbed",label:"Choose a tool",items:[
   {name:"Crelate",blocks:[
    P("Crelate describes itself as an AI recruiting platform that combines sourcing, outreach, applicant tracking, client collaboration, reporting, and business development on one shared record."),
    UL(["Keep candidate, contact, and company information in one place so relationships and client work stay connected.","Track candidates from first contact through placement, and track client opportunities in the same system.","Let hiring managers review candidates and leave feedback that writes back to the pipeline, through a client portal.","Make previously researched people easy to find again, so sourcing starts from what is already known."],"The recruiting purpose behind it"),
    CHIPS(["Candidates","Contacts","Companies","Jobs","Pipelines","Placements","Opportunities"],"Records you will meet"),
    UL(["Source: browser capture and an AI sourcing agent for people outside the database.","Enrich: contact enrichment to fill incomplete records.","Update: prompts that surface role changes and suggest reasons to reconnect.","Clean: duplicate detection when importing from spreadsheets and other systems."],"Where the lifecycle shows up"),
    CALL("warn","Features depend on the plan and on how the client has configured the system.","Keep in mind")]},
   {name:"Bullhorn",blocks:[
    P("Bullhorn describes its ATS and CRM as a cloud-based platform for staffing and recruiting firms that combines applicant tracking, CRM, AI, automation, and analytics."),
    UL(["Manage both sides of the business: the client who needs talent and the candidate who may fill the role.","Connect job orders, submissions, interviews, and placements, so the history of each opportunity is visible.","Keep email and conversation history visible to the team, so any recruiter can continue the work.","Search the existing candidate database against a job before sourcing elsewhere."],"The recruiting purpose behind it"),
    CHIPS(["Candidates","Client contacts","Client companies","Job orders","Submissions","Placements"],"Records you will meet"),
    UL(["Source and reuse: Search & Match builds searches from job descriptions and ranks candidates from the existing database.","Add: résumés parsed in from email, and two-way email tracking.","Engage: automated follow-ups, candidate updates, and outreach triggered by activity.","Track: reporting on recruiter and candidate communication across the funnel."],"Where the lifecycle shows up"),
    CALL("warn","Features depend on the plan and on how the client has configured the system.","Keep in mind")]},
   {name:"Loxo",blocks:[
    P("Loxo calls its product a Talent Intelligence Platform: people search, ATS and pipelines, recruiting CRM, outreach, data enrichment, and reporting in one system."),
    UL(["Turn talent discovery into managed records: find people, enrich them, and bring them into a pipeline.","Reduce switching between separate search tools, contact tools, spreadsheets, and the candidate database.","Support both agencies and in-house teams, including client and job management.","Keep outreach and follow-ups attached to the person’s record."],"The recruiting purpose behind it"),
    CHIPS(["People and candidates","Clients and companies","Jobs","Pipelines","Outreach and activity"],"Records you will meet"),
    UL(["Source: a people-search database of professionals.","Enrich: finding contact details and keeping CRM records updated through AI agents.","Engage: multi-channel outreach campaigns and automated follow-up sequences.","Reuse: natural-language search and AI recommendations across the talent database."],"Where the lifecycle shows up"),
    CALL("warn","Features depend on the plan and on how the client has configured the system.","Keep in mind")]}
  ]}]),
 SEC("10d","Mapping the lifecycle to the tools","Table",[
  P("The eight lifecycle stages from Chapter 4 appear in every tool. This table shows where each stage lives in each platform, at the level of purpose."),
  TB(["Lifecycle stage","Crelate","Bullhorn","Loxo"],[
   ["Source","Browser capture and an AI sourcing agent","Search & Match against the candidate database","People search across a large professional database"],
   ["Add","Imports from spreadsheets and other systems","Résumés parsed in from email; two-way email tracking","Search results brought into pipelines"],
   ["Enrich","Contact enrichment for incomplete records","Candidate records updated from recorded calls","Contact-detail discovery and AI-assisted record updates"],
   ["Classify","Client-configured fields, tags, and statuses. Follow the client’s taxonomy.","Client-configured fields, tags, and statuses. Follow the client’s taxonomy.","Client-configured fields, tags, and statuses. Follow the client’s taxonomy."],
   ["Engage","Email, text, and call sequences","Automated follow-ups and campaigns; two-way email sync","Multi-channel outreach and follow-up sequences"],
   ["Update","Prompts that surface role changes","Shared activity and conversation history","AI agents that keep CRM records updated"],
   ["Reuse","Plain-language questions about your own data","Always-on searches against the candidate database","Natural-language search and recommendations"],
   ["Clean","Duplicate detection on import","Follow the client’s duplicate and merge procedure","Follow the client’s duplicate and merge procedure"]]),
  NOTE("Descriptions come from each vendor’s own materials and vary by plan and configuration. They show where a concept lives in the tool, not how to operate it.")]),
 SEC("10e","Principles that apply in any client tool","Checklist",[
  CHK(["Search before you add, so you update an existing record instead of creating a duplicate.","Confirm identity with more than one identifier; a matching name alone is not enough.","Record the source and the date for important fields.","Follow the client’s taxonomy, picklists, and required fields.","Keep notes factual, concise, and job-related.","Respect opt-outs and Do Not Contact flags.","Keep sensitive information out of notes and tags.","Use only approved tools, and never put confidential candidate or client information into unapproved AI tools.","Flag duplicates and conflicts you are unsure about instead of guessing."]),
  CALL("bpo","The quality of our work depends on whether it creates lasting value for the client: records that are accurate, searchable, reusable, and useful for future opportunities.")]),
 SEC("10f","Questions to ask before you start in a client’s database","Onboarding",[
  UL(["Which fields are required, and which picklists or taxonomy must I use?","What do the statuses and stages mean here?","How are duplicates handled, and who is allowed to merge?","Who owns a record, and how do I avoid duplicate outreach?","Where should the source and verification status be recorded?","What are the rules for opt-outs, retention, and sensitive information?","Which enrichment and AI tools are approved for this client?","Who do I escalate to when identity or data is unclear?"],"Ask the team lead or the client")])
 ]},

{id:11,title:"Practical recruiting scenarios",
 lede:"Apply database and ATS/CRM knowledge to five day-to-day recruiting situations, with practical steps.",
 take:"A recruiting database is more than a place to store resumes. It helps recruiters reuse existing talent, preserve relationship history, avoid duplicate work, run structured searches, and maintain accurate records. Every action should follow the organization’s process, respect candidate preferences and privacy requirements, and leave a clear record of the decision or next step.",
 long:true,
 intro:"This section explains how recruiters use a recruiting database or ATS/CRM to handle common day-to-day situations. The objective is to follow a consistent process, maintain accurate candidate records, and make effective use of existing talent before starting new sourcing.",
 sections:[
 SEC("11a","What should a recruiter check in the database when a new job comes in?","Scenario 1",[
  {t:"answer",text:"Search for existing candidates using relevant job titles, skills, industry, and location. Review resumes, recruiter notes, previous submissions, and candidate availability before starting new sourcing."},
  {t:"lbl",text:"Practical steps"},
  STAIRS(TX(["Confirm the role requirements, essential skills, seniority, industry experience, and location.","Search the existing database using job titles, related titles, keywords, Boolean search, and available filters.","Review resumes, employment history, recruiter notes, previous submissions, contact details, and last-contact dates.","Check candidate interest and availability, and confirm that profile information is current.","Shortlist suitable candidates and record the search or screening outcome before sourcing externally."])),
  CALL("warn","Starting external sourcing before searching existing records, or treating an old record as proof that someone is still available.","Common mistake")]),
 SEC("11b","What happens to a candidate who is not right for the current role?","Scenario 2",[
  {t:"answer",text:"Update their profile with relevant notes, skills, and preferences. Keep them in the talent pipeline for future opportunities instead of discarding them."},
  {t:"lbl",text:"Practical steps"},
  STAIRS(TX(["Record the role-specific reason they were not selected, using factual and job-related notes.","Capture relevant skills, experience, location preferences, salary expectations if appropriately collected, and career interests.","Update the candidate’s status according to the organization’s process, such as “not suitable for this role” or “future opportunity.”","Retain the candidate in an appropriate talent pool when permitted and useful.","Respect candidate communication preferences, consent, and data-retention rules before future outreach."])),
  CALL("warn","Writing a vague or subjective note such as “not a fit,” or discarding the record instead of keeping it for future roles.","Common mistake")]),
 SEC("11c","How should potential duplicates be handled?","Scenario 3",[
  {t:"answer",text:"Verify duplicates using names, emails, phone numbers, and LinkedIn profiles. Merge confirmed duplicates according to database procedures while preserving important candidate information and communication history."},
  {t:"lbl",text:"Practical steps"},
  STAIRS(TX(["Compare identifiers such as email addresses, phone numbers, LinkedIn URLs, employment history, and location; a matching name alone is not sufficient.","Open both records and check whether they represent the same person or two different people with similar names.","Follow the organization’s duplicate-resolution procedure and use the platform’s merge function only when the match is confirmed and the user has the required permissions.","Preserve useful notes, source links, activity history, submissions, and communication records during the merge.","If the match is uncertain, flag the records for review rather than deleting either profile."])),
  CALL("warn","Merging records because the names match. A false merge can combine two people’s histories and cause more harm than a duplicate.","Common mistake")]),
 SEC("11d","How would a recruiter search for 10 Project Managers in a market?","Scenario 4",[
  {t:"answer",text:"Use job titles, Boolean searches, industry keywords, and location filters. Review candidate profiles, shortlist 10 qualified Project Managers, and initiate targeted outreach."},
  {t:"lbl",text:"Practical steps"},
  STAIRS(TX(["Clarify the market: target location or region, industry, seniority, project type, and essential qualifications.","Search for title variations such as “Project Manager,” “Senior Project Manager,” and relevant industry-specific titles.","Combine Boolean terms and filters. For example: (“Project Manager” OR “Program Manager”) AND (construction OR infrastructure), then apply the appropriate location and experience filters.","Review each profile for project scope, industry relevance, skills, career history, qualifications, and comparable responsibilities.","Validate the shortlist against job requirements, check for duplicates and current contact details, and select the 10 strongest matches.","Record search criteria and outreach status in the ATS/CRM so the process is repeatable and auditable."])),
  CALL("warn","Searching with only one title, or recording nothing about the search, so no one else can repeat or audit it.","Common mistake")]),
 SEC("11e","How can a previous candidate be re-engaged months later?","Scenario 5",[
  {t:"answer",text:"Review previous conversations and feedback, check their current professional status, and send a personalized follow-up about a relevant opportunity. Update their information in the database."},
  {t:"lbl",text:"Practical steps"},
  STAIRS(TX(["Review the candidate’s previous application, interview feedback, recruiter notes, interests, and last conversation.","Verify current employment, role, location, and other relevant professional details using appropriate sources.","Check whether the candidate’s preferences and communication permissions allow contact.","Send a concise, personalized message explaining why the opportunity may fit their experience or stated interests.","Record the outreach date, channel, response, and next follow-up action in the ATS/CRM.","If the candidate is not interested, update their preferences and follow-up status respectfully."])),
  CALL("warn","Sending a generic message, treating silence as interest, or contacting someone who has opted out.","Common mistake")]),
 SEC("11f","The recruiter’s operating standard","Conclusion",[
  P("A strong recruiting operation combines market understanding, disciplined research, accurate records, relationship management, and well-controlled technology. A system cannot compensate for unclear job criteria, weak account analysis, incorrect identity matching, or poor data governance. Connect every tool and workflow to a clear recruiting purpose.")]),
 SEC("11g","The playbook at a glance","Summary",[
  TB(["Chapter","Core learning outcome"],[
   ["1. Recruiting database","Understand the database as a searchable, reusable business asset."],
   ["2. ATS vs. recruiting CRM","Tell process management from relationship management, and know why platforms combine both."],
   ["3. How recruiters use databases","Follow the workflow: new job, search, review, engage, track, reuse."],
   ["4. Database lifecycle","Source, add, enrich, classify, engage, update, reuse, and clean records."],
   ["5. Database quality","Verify identity and facts, standardize fields, and record provenance."],
   ["6. Searchability and taxonomy","Translate requirements into searches and standard categories."],
   ["7. Database + sourcing","Turn every sourcing activity into a lasting talent asset."],
   ["8. Database + candidate relationships","Keep history, follow up, segment, and re-engage respectfully."],
   ["9. Major ATS/CRM platforms","Understand categories, vendor positioning, AI, and integrations."],
   ["10. BPO Wizard’s tools","Connect the concepts to Crelate, Bullhorn, and Loxo."],
   ["11. Practical scenarios","Apply the playbook to common recruiting situations."],
   ["12. Glossary","Use consistent terms so everyone means the same thing."]])])
 ]},
